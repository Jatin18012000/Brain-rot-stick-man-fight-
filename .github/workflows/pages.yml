# Publishes the game to GitHub Pages so it can be installed on a phone.
# Enable once under Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    # The repository had no main branch when this was added, so the working
    # branch below is currently the default. Once it is merged into main you
    # can drop that second entry.
    branches:
      - main
      - claude/practical-gates-c78v2e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every combo is performable
        run: node tools/check-combos.mjs
      - name: Simulate the 100-floor economy
        run: node tools/balance.mjs
      - name: Build the single-file version
        run: node tools/build-standalone.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the single-file version
        run: node tools/build-standalone.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
