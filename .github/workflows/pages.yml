# Publishes the game to GitHub Pages so it can be installed on a phone.
# Enable once under Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment only accepts deployments from the
    # repository's DEFAULT branch. This repo's default is still the working
    # branch (it was created empty), so a deploy from main is rejected before
    # a runner is even assigned. Both branches are listed until the default is
    # switched to main under Settings -> General, after which the second entry
    # can be dropped.
    branches:
      - main
      - claude/practical-gates-c78v2e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Queue deploys rather than cancelling them. Two branches currently trigger
  # this workflow, and cancel-in-progress killed the run that would have
  # published when they were pushed a second apart.
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every combo is performable
        run: node tools/check-combos.mjs
      - name: Simulate the 100-floor economy
        run: node tools/balance.mjs
      - name: Build the single-file version
        run: node tools/build-standalone.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the single-file version
        run: node tools/build-standalone.mjs
      # Pages must be switched on once by a repository admin:
      # Settings -> Pages -> Source: GitHub Actions. The workflow token is not
      # allowed to create the Pages site itself ("Resource not accessible by
      # integration"), so enablement: true does not help here.
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
