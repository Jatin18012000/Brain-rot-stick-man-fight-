    spark(x, y, count, color, power) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (0.5 + Math.random()) * (power || 200);
        addFx({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.32 + Math.random() * 0.25, max: 0.5, color: color || '#fff3b0', size: 2 + Math.random() * 2.5 });
      }
    },
    ring(x, y, color, r0, r1, life) {
      addFx({ type: 'ring', x, y, r: r0 || 6, r1: r1 || 70, life: life || 0.3, max: life || 0.3, color: color || '#ffffff' });
    },
    dust(x, y, dir) {
      for (let i = 0; i < 5; i++) {
        addFx({ type: 'dust', x, y, vx: dir * (30 + Math.random() * 90), vy: -Math.random() * 50, life: 0.4, max: 0.4, size: 3 + Math.random() * 5 });
      }
    },
    text(x, y, text, color, size) {
      addFx({ type: 'text', x, y, vy: -70, life: 0.85, max: 0.85, text, color: color || '#fff', size: size || 22 });
    },
    shock(x, y, color) {
      addFx({ type: 'shock', x, y, life: 0.4, max: 0.4, color: color || '#9ad0ff' });
    },
    trail(x, y, color, scale) {
      addFx({ type: 'trail', x, y, life: 0.22, max: 0.22, color: color || '#ffffff', scale: scale || 1 });
    },
    clear() { fx.length = 0; },
  };

  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const p = fx[i];
      p.life -= dt;
      if (p.life <= 0) { fx.splice(i, 1); continue; }
      if (p.vx !== undefined) p.x += p.vx * dt;
      if (p.vy !== undefined) { p.y += p.vy * dt; p.vy += (p.type === 'spark' ? 900 : 200) * dt; }
      if (p.type === 'ring') p.r = U.lerp(p.r, p.r1, 1 - Math.pow(p.life / p.max, 2));
    }
  }

  function drawFx(ctx) {
    fx.forEach((p) => {
      const a = U.clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.type === 'spark') {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      } else if (p.type === 'dust') {
        ctx.fillStyle = 'rgba(200,200,210,0.5)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - a), 0, 7); ctx.fill();
      } else if (p.type === 'ring') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 3 * a + 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
      } else if (p.type === 'text') {
        ctx.fillStyle = p.color;
        ctx.font = '900 ' + (p.size * (0.8 + a * 0.4)) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
      } else if (p.type === 'shock') {
        const r = (1 - a) * 120;
        ctx.strokeStyle = p.color; ctx.lineWidth = 6 * a;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.stroke();
        ctx.lineWidth = 2 * a;
        ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.6, 0, 7); ctx.stroke();
      } else if (p.type === 'trail') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 2;
        ctx.globalAlpha = a * 0.35;
        ctx.beginPath(); ctx.arc(p.x, p.y - 50 * p.scale, 34 * p.scale, 0, 7); ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------- backgrounds
  const bgCache = {};

  function drawBackground(ctx, tier, t, shakeX) {
    const key = tier.name;
    if (!bgCache[key]) bgCache[key] = buildBg(tier);
    const bg = bgCache[key];

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, tier.sky[0]);
    g.addColorStop(1, tier.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(-100, -100, W + 200, H + 200);

    // far silhouettes (slow parallax)
    ctx.save();
    ctx.translate(shakeX * 0.25, 0);
    bg.far.forEach((s) => {
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x, s.y, s.w, s.h);
    });
    ctx.restore();

    drawDeco(ctx, tier, t, bg);

    // ground
    ctx.fillStyle = tier.ground;
    ctx.fillRect(-100, GROUND_Y, W + 200, H - GROUND_Y + 100);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-100, GROUND_Y + 0.5); ctx.lineTo(W + 100, GROUND_Y + 0.5); ctx.stroke();

    // floor perspective lines
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 16; i++) {
      const x = (i / 16) * W;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.lineTo(W / 2 + (x - W / 2) * 2.4, H + 40);
      ctx.stroke();
    }

    // accent glow strip
    const gg = ctx.createLinearGradient(0, GROUND_Y - 40, 0, GROUND_Y);
    gg.addColorStop(0, 'rgba(0,0,0,0)');
    gg.addColorStop(1, hexA(tier.accent, 0.16));
    ctx.fillStyle = gg;
    ctx.fillRect(-100, GROUND_Y - 40, W + 200, 40);
  }

  function buildBg(tier) {
    const rng = U.rng(tier.name.length * 977 + tier.name.charCodeAt(0) * 31);
    const far = [];
    for (let i = 0; i < 22; i++) {
      const w = rng.range(30, 90);
      const h = rng.range(60, 260);
      far.push({ x: rng.range(-40, W), y: GROUND_Y - h, w, h, color: 'rgba(255,255,255,' + rng.range(0.015, 0.05).toFixed(3) + ')' });
    }
    const motes = [];
    for (let i = 0; i < 46; i++) {
      motes.push({ x: rng.range(0, W), y: rng.range(0, GROUND_Y), s: rng.range(0.6, 2.6), sp: rng.range(6, 34), ph: rng.range(0, 7) });
    }
    return { far, motes, rng };
  }

  function drawDeco(ctx, tier, t, bg) {
    const acc = tier.accent;
    switch (tier.deco) {
      case 'dojo':
        for (let i = 0; i < 5; i++) {
          const x = 70 + i * 210;
          ctx.fillStyle = 'rgba(255,255,255,0.05)';
          ctx.fillRect(x, 120, 26, GROUND_Y - 120);
          ctx.fillStyle = hexA(acc, 0.10);
          ctx.fillRect(x - 6, 112, 38, 12);
        }
        ctx.fillStyle = hexA(acc, 0.07);
        ctx.beginPath(); ctx.arc(W / 2, 180, 90, 0, 7); ctx.fill();
        break;
      case 'market':
        for (let i = 0; i < 7; i++) {
          const x = 40 + i * 140;
          ctx.fillStyle = hexA(acc, 0.09);
          ctx.beginPath();
          ctx.moveTo(x, 200); ctx.lineTo(x + 120, 200); ctx.lineTo(x + 100, 240); ctx.lineTo(x + 20, 240);
          ctx.closePath(); ctx.fill();
        }
        break;
      case 'neon': {
        const pulse = 0.5 + 0.5 * Math.sin(t * 2.4);
        for (let i = 0; i < 6; i++) {
          const x = 60 + i * 160, y = 120 + (i % 3) * 70;
          ctx.strokeStyle = hexA(acc, 0.22 + 0.2 * ((pulse + i * 0.2) % 1));
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, 90, 40);
        }
        break;
      }
      case 'roof':
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        for (let i = 0; i < 9; i++) ctx.fillRect(i * 120, GROUND_Y - 70 - (i % 4) * 40, 90, 200);
        break;
      case 'ice':
        for (let i = 0; i < 12; i++) {
          const x = (i * 97) % W;
          ctx.fillStyle = hexA(acc, 0.08);
          ctx.beginPath();
          ctx.moveTo(x, 0); ctx.lineTo(x + 26, 0); ctx.lineTo(x + 13, 90 + (i % 5) * 40);
          ctx.closePath(); ctx.fill();
        }
        break;
      case 'fire': {
        const fl = 0.5 + 0.5 * Math.sin(t * 6);
        ctx.fillStyle = hexA(acc, 0.10 + fl * 0.08);
        ctx.beginPath(); ctx.arc(W / 2, GROUND_Y, 260, Math.PI, 0); ctx.fill();
        break;
      }
      case 'garden':
        for (let i = 0; i < 8; i++) {
          const x = 50 + i * 125;
          ctx.fillStyle = hexA(acc, 0.10);
          ctx.beginPath(); ctx.arc(x, 150 + (i % 3) * 50, 34, 0, 7); ctx.fill();
          ctx.fillRect(x - 3, 150, 6, GROUND_Y - 150);
        }
        break;
      case 'lab':
        ctx.strokeStyle = hexA(acc, 0.14);
        ctx.lineWidth = 2;
        for (let i = 0; i < 10; i++) {
          ctx.beginPath();
          ctx.arc(W / 2, GROUND_Y - 100, 40 + i * 34, Math.PI * 0.9 + Math.sin(t * 0.4 + i) * 0.1, Math.PI * 2.1);
          ctx.stroke();
        }
        break;
      case 'arena':
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        for (let r = 0; r < 4; r++) ctx.fillRect(0, 150 + r * 46, W, 30);
        ctx.fillStyle = hexA(acc, 0.10);
        for (let i = 0; i < 40; i++) ctx.fillRect((i * 47 + (i % 3) * 11) % W, 152 + (i % 4) * 46, 10, 24);
        break;
      case 'spire': {
        const sh = 0.5 + 0.5 * Math.sin(t * 1.2);
        ctx.fillStyle = hexA(acc, 0.06 + sh * 0.05);
        ctx.beginPath(); ctx.arc(W / 2, 210, 150 + sh * 14, 0, 7); ctx.fill();
        ctx.strokeStyle = hexA(acc, 0.2);
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const a = t * 0.3 + (i / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(W / 2, 210, 190, 46, a, 0, Math.PI * 2);
          ctx.stroke();
        }
        break;
      }
      default: break;
    }

    // ambient motes / snow / embers
    ctx.fillStyle = hexA(acc, 0.35);
    bg.motes.forEach((m) => {
      const y = (m.y + t * m.sp) % GROUND_Y;
      const x = m.x + Math.sin(t * 0.7 + m.ph) * 18;
      ctx.globalAlpha = 0.10 + 0.18 * (0.5 + 0.5 * Math.sin(t * 2 + m.ph));
      ctx.fillRect(x, y, m.s, m.s);
    });
    ctx.globalAlpha = 1;
  }

  function hexA(hex, a) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  R.hexA = hexA;

  // -------------------------------------------------------- fighter render
  function drawFighter(ctx, f, opts) {
    const o = opts || {};
    const s = f.scale;
    const p = poseFor(f, f.animT + (f.isPlayer ? 0 : 0.7));
    const facing = f.facing;
    const x = f.x;
    const y = f.y;

    const hipDrop = p.hip * s;
    const pelvis = { x: x + Math.sin(U.rad(p.lean)) * 4 * facing, y: y - P.pelvis * s + hipDrop };
    const leanV = dirVec(180 + p.lean, facing);
    const torsoLen = (P.neck - P.pelvis) * s;
    const neck = { x: pelvis.x + leanV.x * torsoLen, y: pelvis.y + leanV.y * torsoLen };
    const headC = { x: neck.x + leanV.x * (P.headY - P.neck + P.headR * 0.4) * s, y: neck.y + leanV.y * (P.headY - P.neck + P.headR * 0.4) * s };

    const shoulderF = { x: neck.x + facing * P.shoulderW * 0.35 * s, y: neck.y + 2 * s };
    const shoulderB = { x: neck.x - facing * P.shoulderW * 0.35 * s, y: neck.y + 3 * s };
    const hipF = { x: pelvis.x + facing * P.hipW * 0.3 * s, y: pelvis.y };
    const hipB = { x: pelvis.x - facing * P.hipW * 0.3 * s, y: pelvis.y };

    const armF = limb(shoulderF.x, shoulderF.y, p.armF[0], P.upperArm * s, p.armF[1], P.foreArm * s, facing);
    const armB = limb(shoulderB.x, shoulderB.y, p.armB[0], P.upperArm * s, p.armB[1], P.foreArm * s, facing);
    const legF = limb(hipF.x, hipF.y, p.legF[0], P.thigh * s, p.legF[1], P.shin * s, facing);
    const legB = limb(hipB.x, hipB.y, p.legB[0], P.thigh * s, p.legB[1], P.shin * s, facing);

    const gear = f.gear || {};
    const bodyColor = f.flash > 0 ? '#ffffff' : f.colors.body;
    const lw = 7 * s;

    ctx.save();

    // aura for wardens / rage
    if (f.colors.aura) {
      const pulse = 0.5 + 0.5 * Math.sin(f.animT * 4);
      ctx.globalAlpha = 0.16 + pulse * 0.12;
      ctx.fillStyle = f.colors.aura;
      ctx.beginPath(); ctx.ellipse(x, y - 56 * s, 44 * s, 66 * s, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (f.meter >= 100) {
      const pulse = 0.5 + 0.5 * Math.sin(f.animT * 9);
      ctx.globalAlpha = 0.10 + pulse * 0.14;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.ellipse(x, y - 56 * s, 40 * s, 64 * s, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (f.tonicFlash > 0) {
      ctx.globalAlpha = f.tonicFlash * 0.5;
      ctx.fillStyle = '#7ee787';
      ctx.beginPath(); ctx.ellipse(x, y - 56 * s, 42 * s, 66 * s, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // shadow
    ctx.globalAlpha = U.clamp(1 - (GROUND_Y - y) / 260, 0.15, 0.5);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x, GROUND_Y + 2, 26 * s, 6 * s, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // back limbs (darker, reads as depth)
    const backColor = shade(bodyColor, -0.35);
    stroke(ctx, [shoulderB, armB.joint, armB.end], lw * 0.9, backColor);
    stroke(ctx, [hipB, legB.joint, legB.end], lw, backColor);
    if (gear.boots) drawBoot(ctx, legB.end, p.legB[0] + p.legB[1], s, facing, gear.bootTier, backColor);

    // torso + armour
    if (gear.armor) {
      ctx.strokeStyle = gear.armorColor || f.colors.accent;
      ctx.lineWidth = lw * 2.2;
      ctx.beginPath(); ctx.moveTo(pelvis.x, pelvis.y); ctx.lineTo(neck.x, neck.y); ctx.stroke();
      ctx.strokeStyle = shade(gear.armorColor || f.colors.accent, -0.3);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pelvis.x, pelvis.y); ctx.lineTo(neck.x, neck.y); ctx.stroke();
    }
    stroke(ctx, [pelvis, neck], lw * 1.15, bodyColor);

    // head
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.arc(headC.x, headC.y, P.headR * s, 0, 7); ctx.fill();
    if (gear.head) {
      ctx.fillStyle = gear.headColor || f.colors.accent;
      ctx.beginPath();
      ctx.arc(headC.x, headC.y, P.headR * s * 1.06, Math.PI * (facing > 0 ? 0.95 : 0.05), Math.PI * (facing > 0 ? 2.05 : 1.15));
      ctx.fill();
      if (gear.headTier >= 5) {
        ctx.strokeStyle = gear.headColor || f.colors.accent;
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        ctx.moveTo(headC.x - facing * 2 * s, headC.y - P.headR * s);
        ctx.lineTo(headC.x + facing * 3 * s, headC.y - P.headR * s * 2.1);
        ctx.stroke();
      }
    }
    // eye direction dot — sells which way the fighter faces
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.arc(headC.x + facing * P.headR * 0.42 * s, headC.y - 1 * s, 1.9 * s, 0, 7); ctx.fill();

    // front limbs
    stroke(ctx, [hipF, legF.joint, legF.end], lw, bodyColor);
    if (gear.boots) drawBoot(ctx, legF.end, p.legF[0] + p.legF[1], s, facing, gear.bootTier, bodyColor);
    stroke(ctx, [shoulderF, armF.joint, armF.end], lw * 0.95, bodyColor);

    // weapon / gauntlet on the front hand
    if (gear.weaponTier) drawWeapon(ctx, armF.end, p.armF[0] + p.armF[1], s, facing, gear.weaponTier, gear.weaponColor || f.colors.accent);
    if (gear.glovesTier) {
      ctx.fillStyle = shade(f.colors.accent, 0.1);
      ctx.beginPath(); ctx.arc(armB.end.x, armB.end.y, 3.2 * s, 0, 7); ctx.fill();
    }
    if (gear.charm) {
      const cx = pelvis.x - facing * 8 * s, cy = pelvis.y + 2 * s;
      const glow = 0.5 + 0.5 * Math.sin(f.animT * 5);
      ctx.globalAlpha = 0.5 + glow * 0.5;
      ctx.fillStyle = gear.charmColor || '#ffd166';
      ctx.beginPath(); ctx.arc(cx, cy, 3 * s, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // block spark
    if (f.blocking && f.state !== 'attack' && f.state !== 'special') {
      ctx.strokeStyle = hexA('#9ad0ff', 0.5);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + facing * 18 * s, y - 62 * s, 26 * s, -0.9, 0.9);
      ctx.stroke();
    }

    // guard-break stars
    if (f.state === 'guardbreak') {
      for (let i = 0; i < 3; i++) {
        const a = f.animT * 6 + (i / 3) * Math.PI * 2;
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(headC.x + Math.cos(a) * 18 * s, headC.y - 14 * s + Math.sin(a) * 6 * s, 2.6 * s, 0, 7);
        ctx.fill();
      }
    }

    ctx.restore();

    if (o.debug) {
      const hb = f.hurtbox();
      ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 1; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
      f.activeHits().forEach((h) => {
        ctx.strokeStyle = '#ff3355'; ctx.strokeRect(h.box.x, h.box.y, h.box.w, h.box.h);
      });
    }
  }

  function stroke(ctx, pts, width, color) {
    if (!width || !color) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function drawWeapon(ctx, hand, angle, s, facing, tier, color) {
    const d = dirVec(angle, facing);
    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.rotate(Math.atan2(d.y, d.x));
    ctx.fillStyle = color;
    if (tier <= 2) {
      ctx.fillRect(-3 * s, -3.5 * s, 8 * s, 7 * s);
    } else if (tier <= 4) {
      ctx.fillRect(-4 * s, -4.5 * s, 12 * s, 9 * s);
      ctx.fillStyle = shade(color, 0.3);
      for (let i = 0; i < 3; i++) ctx.fillRect(6 * s + i * 2.5 * s, -4 * s + i * 3 * s, 3 * s, 1.6 * s);
    } else if (tier <= 6) {
      ctx.fillRect(-5 * s, -5 * s, 14 * s, 10 * s);
      ctx.fillStyle = shade(color, 0.4);
      ctx.beginPath();
      ctx.moveTo(9 * s, -5 * s); ctx.lineTo(20 * s, 0); ctx.lineTo(9 * s, 5 * s);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.shadowColor = color; ctx.shadowBlur = 12;
      ctx.fillRect(-6 * s, -5.5 * s, 16 * s, 11 * s);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(10 * s, -6 * s); ctx.lineTo(26 * s, 0); ctx.lineTo(10 * s, 6 * s);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function drawBoot(ctx, foot, angle, s, facing, tier, color) {
    ctx.fillStyle = shade(color, 0.15);
    ctx.save();
    ctx.translate(foot.x, foot.y);
    ctx.fillRect(-3 * s, -2 * s, 10 * s * facing, 5 * s);
    if (tier >= 5) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-2 * s, -3.5 * s, 7 * s * facing, 1.6 * s);
    }
    ctx.restore();
  }

  function shade(hex, amt) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }
  R.shade = shade;

  // ------------------------------------------------------- projectiles
  function drawProjectile(ctx, pr, t) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    const grad = ctx.createRadialGradient(pr.x, pr.y, 2, pr.x, pr.y, pr.w);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, pr.color || '#9ad0ff');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(pr.x, pr.y, pr.w * (1 + Math.sin(t * 20) * 0.06), pr.h * 0.6, 0, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  R.POSE = POSE;
  R.P = P;
  R.FX = FX;
  R.fx = fx;
  R.updateFx = updateFx;
  R.drawFx = drawFx;
  R.drawBackground = drawBackground;
  R.drawFighter = drawFighter;
  R.drawProjectile = drawProjectile;
  R.poseFor = poseFor;

  root.ST = root.ST || {};
  root.ST.Render = R;
})(window);

/* ===== src/hud.js ===== */
/* Stickman Tower — in-fight HUD drawn on the canvas (health, rage, guard,
 * combo counter, announcements). Menus live in the DOM; this is the overlay
 * that has to sit inside the letterboxed game view. */
(function (root) {
  'use strict';

  const U = root.ST.U;
  const R = root.ST.Render;
  const W = R.W;

  const HUD = {};

  function bar(ctx, x, y, w, h, pct, color, bgColor, flip, ghost) {
    ctx.fillStyle = bgColor || 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, w, h);
    const fw = Math.max(0, Math.min(1, pct)) * (w - 4);
    if (ghost !== undefined && ghost > pct) {
      const gw = Math.max(0, Math.min(1, ghost)) * (w - 4);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      if (flip) ctx.fillRect(x + w - 2 - gw, y + 2, gw, h - 4);
      else ctx.fillRect(x + 2, y + 2, gw, h - 4);
    }
    ctx.fillStyle = color;
    if (flip) ctx.fillRect(x + w - 2 - fw, y + 2, fw, h - 4);
    else ctx.fillRect(x + 2, y + 2, fw, h - 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function segBar(ctx, x, y, w, h, pct, color, flip, segments) {
    const segs = segments || 10;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x, y, w, h);
    const sw = (w - 4) / segs;
    for (let i = 0; i < segs; i++) {
      const on = pct >= (i + 1) / segs;
      const partial = !on && pct > i / segs;
      if (!on && !partial) continue;
      const frac = on ? 1 : (pct - i / segs) * segs;
      const sx = flip ? x + w - 2 - (i + 1) * sw : x + 2 + i * sw;
      ctx.fillStyle = color;
      ctx.globalAlpha = on ? 1 : 0.55;
      ctx.fillRect(flip ? sx + sw * (1 - frac) : sx, y + 2, sw * frac - 1, h - 4);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  HUD.draw = function (ctx, g) {
    const p = g.player, b = g.boss;
    const barW = 360, barH = 20;

    ctx.save();
    ctx.textBaseline = 'alphabetic';

    // ---- player side
    ctx.font = '700 15px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText('YOU  Lv.' + g.save.level, 24, 34);
    bar(ctx, 24, 42, barW, barH, p.hp / p.maxHp, '#4ade80', null, false, g.ghostP);
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, 28, 57);

    segBar(ctx, 24, 68, 240, 10, p.meter / 100, p.meter >= 100 ? '#ffd166' : '#ff9f1c', false, 4);
    ctx.fillStyle = p.meter >= 100 ? '#ffd166' : 'rgba(255,255,255,0.6)';
    ctx.font = '700 10px system-ui, sans-serif';
    ctx.fillText('RAGE', 270, 77);

    segBar(ctx, 24, 82, 200, 7, p.guard / 100, p.guard < 30 ? '#ff5c7c' : '#7bdff2', false, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('GUARD', 230, 89);

    // tonics
    for (let i = 0; i < g.tonics; i++) {
      ctx.fillStyle = '#7ee787';
      ctx.beginPath(); ctx.arc(32 + i * 18, 104, 6, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.4; ctx.stroke();
    }
    if (g.tonics > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '600 10px system-ui, sans-serif';
      ctx.fillText('TONIC', 32 + g.tonics * 18 + 4, 108);
    }

    // ---- boss side
    ctx.textAlign = 'right';
    ctx.font = '700 15px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(b.name.toUpperCase(), W - 24, 34);
    bar(ctx, W - 24 - barW, 42, barW, barH, b.hp / b.maxHp, g.bossInfo.warden || g.bossInfo.final ? '#ff4d6d' : '#ff7b54', null, true, g.ghostB);
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(g.bossInfo.title + '  •  ' + g.bossInfo.arch, W - 28, 76);
    segBar(ctx, W - 24 - 240, 82, 240, 8, b.meter / 100, '#ff9f1c', true, 4);

    // ---- centre: floor + timer
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(ctx, W / 2 - 62, 16, 124, 56, 10);
    ctx.fill();
    ctx.fillStyle = g.bossInfo.final ? '#ffd76e' : '#fff';
    ctx.font = '900 30px system-ui, sans-serif';
    ctx.fillText(U.time(g.timer), W / 2, 46);
    ctx.font = '700 11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.fillText('FLOOR ' + g.bossInfo.floor + ' / 100', W / 2, 64);

    // ---- combo counter
    if (g.comboCount >= 2 && g.comboTimer > 0) {
      const a = U.clamp(g.comboTimer / 0.4, 0, 1);
      ctx.globalAlpha = a;
      ctx.textAlign = 'left';
      const cy = 210;
      ctx.fillStyle = '#ffd166';
      ctx.font = '900 46px system-ui, sans-serif';
      ctx.fillText(g.comboCount, 40, cy);
      ctx.fillStyle = '#fff';
      ctx.font = '800 18px system-ui, sans-serif';
      ctx.fillText('HITS', 40 + ctx.measureText(String(g.comboCount)).width + 26, cy - 4);
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillText(Math.round(g.comboDamage) + ' DMG', 40, cy + 18);
      ctx.globalAlpha = 1;
    }

    // ---- special name banner
    if (g.specialBanner && g.specialBannerT > 0) {
      const a = U.clamp(g.specialBannerT / 0.5, 0, 1);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd166';
      ctx.font = '900 30px system-ui, sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(g.specialBanner, W / 2, 150);
      ctx.fillText(g.specialBanner, W / 2, 150);
      ctx.globalAlpha = 1;
    }

    // ---- combo hint strip (what you can do right now)
    if (g.hintT > 0 && g.hint && g.announceT <= 0) {
      const a = U.clamp(g.hintT, 0, 1);
      ctx.globalAlpha = a * 0.92;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      const text = g.hint;
      ctx.font = '700 15px system-ui, sans-serif';
      const tw = ctx.measureText(text).width;
      roundRect(ctx, W / 2 - tw / 2 - 14, 178, tw + 28, 28, 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(text, W / 2, 197);
      ctx.globalAlpha = 1;
    }

    // ---- big announcements
    if (g.announce && g.announceT > 0) {
      const t = 1 - U.clamp(g.announceT / g.announceMax, 0, 1);
      const scale = 1 + (1 - U.easeOut(U.clamp(t * 3, 0, 1))) * 0.8;
      ctx.save();
      ctx.translate(W / 2, 240);
      ctx.scale(scale, scale);
      ctx.textAlign = 'center';
      ctx.font = '900 64px system-ui, sans-serif';
      ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.strokeText(g.announce, 0, 0);
      const grad = ctx.createLinearGradient(0, -40, 0, 20);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(1, g.announceColor || '#ffd166');
      ctx.fillStyle = grad;
      ctx.fillText(g.announce, 0, 0);
      if (g.announceSub) {
        ctx.font = '700 20px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText(g.announceSub, 0, 34);
      }
      ctx.restore();
    }

    ctx.restore();
  };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  HUD.roundRect = roundRect;

  root.ST = root.ST || {};
  root.ST.HUD = HUD;
})(window);

/* ===== src/ui.js ===== */
/* Stickman Tower — DOM screens (tower map, shop, move list, settings,
 * results, pause). The fight itself is canvas; everything else is HTML so it
 * scrolls and scales naturally on a phone. */
(function (root) {
  'use strict';

  const U = root.ST.U;
  const Progress = root.ST.Progress;
  const Shop = root.ST.Shop;
  const Floors = root.ST.Floors;
  const Moves = root.ST.Moves;
  const Input = root.ST.Input;
  const Audio = root.ST.Audio;

  const UI = { el: null, touch: null, current: 'title', shopTab: 'gear' };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  UI.init = function (uiEl, touchEl) {
    UI.el = uiEl;
    UI.touch = touchEl;
    UI.el.addEventListener('click', onClick);
  };

  function onClick(e) {
    const btn = e.target.closest('[data-ui]');
    if (!btn) return;
    const action = btn.dataset.ui;
    const arg = btn.dataset.arg;
    Audio.unlock();
    if (action !== 'noop') Audio.play('ui');
    handle(action, arg, btn);
  }

  function handle(action, arg, btn) {
    const G = root.ST.Game;
    switch (action) {
      case 'play': UI.show('tower'); break;
      case 'tower': UI.show('tower'); break;
      case 'shop': UI.show('shop'); break;
      case 'moves': UI.show('moves'); break;
      case 'settings': UI.show('settings'); break;
      case 'title': UI.show('title'); break;
      case 'howto': UI.show('howto'); break;
      case 'fight': G.startFight(parseInt(arg, 10), {}); break;
      case 'train': G.startFight(parseInt(arg, 10), { training: true }); break;
      case 'retry': G.startFight(parseInt(arg, 10), {}); break;
      case 'resume': G.togglePause(); break;
      case 'quit': G.quitFight(); break;
      case 'shopTab': UI.shopTab = arg; UI.show('shop'); break;
      case 'buy': doBuy(arg); break;
      case 'equip': doEquip(arg); break;
      case 'trainStat': doTrainStat(arg); break;
      case 'tonic': doBuyTonic(); break;
      case 'toggle': doToggle(arg, btn); break;
      case 'rebind': doRebind(arg, btn); break;
      case 'resetKeys': Input.resetBindings(); UI.show('settings'); break;
      case 'wipe': doWipe(); break;
      case 'install': UI.show('install'); break;
      default: break;
    }
  }

  // -------------------------------------------------------------- actions
  function doBuy(id) {
    const item = Shop.ITEM_BY_ID[id];
    if (!item) return;
    if (Progress.buyItem(item)) { Audio.play('buy'); UI.show('shop'); }
    else Audio.play('deny');
  }
  function doEquip(id) {
    const item = Shop.ITEM_BY_ID[id];
    if (item && Progress.equip(item)) { Audio.play('ui'); UI.show('shop'); }
  }
  function doTrainStat(id) {
    if (Progress.train(id)) { Audio.play('buy'); UI.show('shop'); }
    else Audio.play('deny');
  }
  function doBuyTonic() {
    const r = Progress.buyTonic();
    if (r === 'ok') { Audio.play('buy'); UI.show('shop'); } else Audio.play('deny');
  }
  function doToggle(key, btn) {
    const G = root.ST.Game;
    G.settings[key] = !G.settings[key];
    if (key === 'sfx') Audio.enabled = G.settings.sfx;
    if (key === 'music') Audio.setMusic(G.settings.music);
    G.saveSettings();
    if (btn) {
      btn.textContent = G.settings[key] ? 'ON' : 'OFF';
      btn.classList.toggle('on', G.settings[key]);
    }
  }
  function doRebind(action, btn) {
    btn.textContent = 'PRESS A KEY…';
    btn.classList.add('listening');
    Input.listenFor(action, () => { UI.show('settings'); });
  }
  function doWipe() {
    if (!root.confirm('Erase all progress? This cannot be undone.')) return;
    Progress.reset();
    root.ST.Game.save = Progress.data;
    UI.show('title');
  }

  // -------------------------------------------------------------- screens
  UI.show = function (screen) {
    UI.current = screen;
    const G = root.ST.Game;
    if (screen !== 'fight') { G.screen = screen === 'result' ? 'result' : screen; }
    UI.el.classList.toggle('hidden', screen === 'fight');
    UI.touch.classList.toggle('hidden', screen !== 'fight');
    document.getElementById('app').classList.toggle('fighting', screen === 'fight');
    UI.el.scrollTop = 0;

    switch (screen) {
      case 'title': UI.el.innerHTML = titleScreen(); break;
      case 'tower': UI.el.innerHTML = towerScreen(); break;
      case 'shop': UI.el.innerHTML = shopScreen(); break;
      case 'moves': UI.el.innerHTML = movesScreen(); break;
      case 'settings': UI.el.innerHTML = settingsScreen(); break;
      case 'howto': UI.el.innerHTML = howtoScreen(); break;
      case 'install': UI.el.innerHTML = installScreen(); break;
      case 'fight': UI.el.innerHTML = ''; UI.syncTonics(); break;
      default: break;
    }
    if (screen === 'tower') scrollToCurrentFloor();
  };

  function topBar(active) {
    const d = Progress.data;
    const xpNeed = Progress.xpToNext(d.level);
    return `
      <div class="topbar">
        <div class="tb-left">
          <button class="chip" data-ui="title">◀</button>
          <span class="stat"><b>${U.comma(d.coins)}</b> <i>coins</i></span>
          <span class="stat"><b>Lv.${d.level}</b> <i>${d.xp}/${xpNeed} xp</i></span>
          <span class="stat"><b>${U.comma(Progress.power())}</b> <i>power</i></span>
        </div>
        <div class="tb-right">
          <button class="chip ${active === 'tower' ? 'on' : ''}" data-ui="tower">TOWER</button>
          <button class="chip ${active === 'shop' ? 'on' : ''}" data-ui="shop">SHOP</button>
          <button class="chip ${active === 'moves' ? 'on' : ''}" data-ui="moves">MOVES</button>
          <button class="chip ${active === 'settings' ? 'on' : ''}" data-ui="settings">⚙</button>
        </div>
      </div>
      <div class="xpline"><div style="width:${Math.round((d.xp / xpNeed) * 100)}%"></div></div>`;
  }

  function titleScreen() {
    const d = Progress.data;
    const started = d.stats.wins > 0 || d.highest > 1;
    return `
      <div class="screen title">
        <div class="logo">
          <div class="logo-sub">BRAIN-ROT</div>
          <h1>STICKMAN<span>TOWER</span></h1>
          <div class="logo-line">100 floors. 100 bosses. One stickman.</div>
        </div>
        <div class="title-buttons">
          <button class="big primary" data-ui="play">${started ? 'CONTINUE — FLOOR ' + d.floor : 'START CLIMBING'}</button>
          <button class="big" data-ui="howto">HOW TO PLAY</button>
          <button class="big" data-ui="moves">MOVES &amp; COMBOS</button>
          <button class="big" data-ui="settings">SETTINGS</button>
          <button class="big ghost" data-ui="install">INSTALL ON PHONE / LAPTOP</button>
        </div>
        ${started ? `<div class="title-stats">
          <span>Highest floor <b>${d.highest}</b></span>
          <span>Wins <b>${d.stats.wins}</b></span>
          <span>Perfects <b>${d.stats.perfect}</b></span>
          <span>Best combo <b>${d.stats.bestCombo}</b></span>
        </div>` : ''}
      </div>`;
  }

  function towerScreen() {
    const d = Progress.data;
    const myPower = Progress.power();
    let rows = '';
    for (let f = 100; f >= 1; f--) {
      const info = Floors.get(f);
      const cleared = f <= d.cleared;
      const current = f === d.highest && !cleared;
      const locked = f > d.highest;
      const ratio = myPower / info.power;
      // Calibrated against tools/balance.mjs: a player who shops after every
      // win sits around 1.2-1.35, which should read as a fair fight.
      const verdict = ratio > 1.45 ? ['easy', 'FAVOURED']
        : ratio > 1.05 ? ['fair', 'FAIR FIGHT']
          : ratio > 0.85 ? ['hard', 'RISKY'] : ['brutal', 'UNDERPOWERED'];
      // The list runs 100 -> 1, so a tier's heading belongs on its highest floor.
      const tierStart = f % 10 === 0;
      const tierLow = Math.floor((f - 1) / 10) * 10 + 1;
      rows += tierStart ? `<div class="tier-head" style="--acc:${info.tier.accent}">${esc(info.tier.name)} · floors ${tierLow}–${tierLow + 9}</div>` : '';
      rows += `
        <div class="floor ${cleared ? 'cleared' : ''} ${current ? 'current' : ''} ${locked ? 'locked' : ''}" id="floor-${f}">
          <div class="fl-num">${f}</div>
          <div class="fl-body">
            <div class="fl-name">${locked ? '???' : esc(info.name)}${info.warden ? ' <em>WARDEN</em>' : ''}${info.final ? ' <em>FINAL</em>' : ''}</div>
            <div class="fl-meta">${locked ? 'Locked' : esc(info.title) + ' · ' + info.arch + ' · ' + U.comma(info.hp) + ' HP'}</div>
          </div>
          <div class="fl-right">
            ${locked ? '<span class="lock">🔒</span>'
        : current ? `<span class="verdict ${verdict[0]}">${verdict[1]}</span><button class="go" data-ui="fight" data-arg="${f}">FIGHT</button>`
          : `<span class="done">✔ CLEARED</span><button class="go ghost" data-ui="train" data-arg="${f}">TRAIN</button>`}
          </div>
        </div>`;
    }
    const conquered = d.cleared >= 100;
    const nextInfo = Floors.get(d.highest);
    const card = conquered ? `
        <div class="next-card" style="--acc:#ffd76e">
          <div class="nc-left">
            <div class="nc-label">TOWER CONQUERED</div>
            <div class="nc-name">All 100 floors</div>
            <div class="nc-sub">The Ascendant is beaten. Any floor can be replayed for coins.</div>
          </div>
          <div class="nc-right">
            <div class="power-cmp"><div><span>YOUR POWER</span><b>${U.comma(myPower)}</b></div></div>
            <button class="big primary" data-ui="train" data-arg="100">FIGHT THE ASCENDANT AGAIN</button>
          </div>
        </div>` : `
        <div class="next-card" style="--acc:${nextInfo.tier.accent}">
          <div class="nc-left">
            <div class="nc-label">NEXT FIGHT</div>
            <div class="nc-name">${esc(nextInfo.name)}</div>
            <div class="nc-sub">Floor ${nextInfo.floor} · ${esc(nextInfo.tier.name)} · ${nextInfo.arch}</div>
          </div>
          <div class="nc-right">
            <div class="power-cmp">
              <div><span>YOU</span><b>${U.comma(myPower)}</b></div>
              <div><span>BOSS</span><b>${U.comma(nextInfo.power)}</b></div>
            </div>
            <button class="big primary" data-ui="fight" data-arg="${nextInfo.floor}">ENTER FLOOR ${nextInfo.floor}</button>
          </div>
        </div>`;
    return `${topBar('tower')}
      <div class="screen tower">
        ${card}
        <div class="floor-list">${rows}</div>
      </div>`;
  }

  function scrollToCurrentFloor() {
    const el = document.getElementById('floor-' + Progress.data.highest);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
  }

  // ------------------------------------------------------------------ shop
  function shopScreen() {
    const tab = UI.shopTab;
    const body = tab === 'gear' ? gearTab() : tab === 'train' ? trainTab() : suppliesTab();
    return `${topBar('shop')}
      <div class="screen shop">
        <div class="tabs">
          <button class="tab ${tab === 'gear' ? 'on' : ''}" data-ui="shopTab" data-arg="gear">GEAR</button>
          <button class="tab ${tab === 'train' ? 'on' : ''}" data-ui="shopTab" data-arg="train">TRAINING</button>
          <button class="tab ${tab === 'sup' ? 'on' : ''}" data-ui="shopTab" data-arg="sup">SUPPLIES</button>
        </div>
        ${body}
      </div>`;
  }

  function statLine(stats) {
    return Object.keys(stats).map((k) =>
      `<span class="sl">${Shop.STAT_LABEL[k]} <b>+${stats[k]}${Shop.STAT_SUFFIX[k]}</b></span>`).join('');
  }

  function gearTab() {
    const d = Progress.data;
    return Shop.SLOTS.map((slot) => {
      const items = Shop.ITEMS.filter((i) => i.slot === slot.id);
      const equipped = d.equipped[slot.id];
      const cards = items.map((item) => {
        const state = Progress.canBuyItem(item);
        const isEquipped = equipped === item.id;
        const owned = d.owned.indexOf(item.id) !== -1;
        let btn;
        if (isEquipped) btn = '<span class="tagx equipped">EQUIPPED</span>';
        else if (owned) btn = `<button class="buy" data-ui="equip" data-arg="${item.id}">EQUIP</button>`;
        else if (state === 'locked') btn = `<span class="tagx lock">FLOOR ${item.floor}</span>`;
        else btn = `<button class="buy ${state === 'poor' ? 'poor' : ''}" data-ui="buy" data-arg="${item.id}">${U.comma(item.cost)} ⬤</button>`;
        return `
          <div class="item ${isEquipped ? 'on' : ''} ${state === 'locked' ? 'dim' : ''}">
            <div class="it-head"><span class="it-tier">${U.roman(item.tier)}</span><span class="it-name">${esc(item.name)}</span></div>
            <div class="it-stats">${statLine(item.stats)}</div>
            <div class="it-foot">${btn}</div>
          </div>`;
      }).join('');
      return `<div class="slot-block"><h3><span class="tr-icon">${slot.icon}</span> ${slot.name}</h3><div class="items">${cards}</div></div>`;
    }).join('');
  }

  function trainTab() {
    const d = Progress.data;
    const c = Progress.combat();
    const cards = Shop.TRAINING.map((t) => {
      const lvl = d.train[t.id] || 0;
      const state = Progress.canTrain(t.id);
      const cost = Shop.trainingCost(t.id, lvl);
      const pips = Array.from({ length: Math.min(t.max, 20) }, (_, i) => {
        const step = t.max > 20 ? Math.ceil(t.max / 20) : 1;
        return `<i class="${lvl >= (i + 1) * step ? 'on' : ''}"></i>`;
      }).join('');
      return `
        <div class="train">
          <div class="tr-head"><span class="tr-icon">${t.icon}</span><b>${t.name}</b><span class="tr-lvl">Lv ${lvl}/${t.max}</span></div>
          <div class="tr-per">${t.per}</div>
          <div class="pips">${pips}</div>
          <button class="buy ${state === 'poor' ? 'poor' : ''} ${state === 'max' ? 'dim' : ''}" data-ui="trainStat" data-arg="${t.id}">
            ${state === 'max' ? 'MAXED' : U.comma(cost) + ' ⬤'}
          </button>
        </div>`;
    }).join('');

(function (root) {
  'use strict';

  const U = root.ST.U;
  const R = root.ST.Render;

  const FIGHT_SECONDS = 99;

  const BOUNDS = { left: 70, right: R.W - 70, ground: R.GROUND_Y };

  const Game = {
    screen: 'title',
    canvas: null, ctx: null,
    dpr: 1, viewScale: 1, viewX: 0, viewY: 0,
    settings: { haptics: true, sfx: true, music: true, showHints: true, debug: false, touchScale: 1, lefty: false },
    save: null,
    running: false,
    paused: false,
    trainingMode: false,
  };

  // ------------------------------------------------------------------ boot
  Game.init = function (canvas, touchLayer) {
    Game.canvas = canvas;
    Game.ctx = canvas.getContext('2d', { alpha: false });
    Progress.load();
    Game.save = Progress.data;
    const s = U.storage.read('st.settings.v1', null);
    if (s) Object.assign(Game.settings, s);
    Audio.enabled = Game.settings.sfx;
    Audio.setMusic(Game.settings.music);

    Input.init(touchLayer);
    Input.onPause = () => {
      if (Game.screen === 'fight') Game.togglePause();
    };

    Game.resize();
    root.addEventListener('resize', Game.resize);
    root.addEventListener('orientationchange', () => setTimeout(Game.resize, 300));

    Game.last = performance.now();
    Game.acc = 0;
    Game.running = true;
    requestAnimationFrame(Game.frame);

  Game.saveSettings = function () { U.storage.write('st.settings.v1', Game.settings); };

  Game.resize = function () {
    const c = Game.canvas;
    if (!c) return;
    const rect = c.parentElement.getBoundingClientRect();
    const dpr = Math.min(root.devicePixelRatio || 1, 2.5);
    Game.dpr = dpr;
    c.width = Math.max(1, Math.round(rect.width * dpr));
    c.height = Math.max(1, Math.round(rect.height * dpr));
    c.style.width = rect.width + 'px';
    c.style.height = rect.height + 'px';
    const scale = Math.min(rect.width / R.W, rect.height / R.H);
    Game.viewScale = scale * dpr;
    Game.viewX = (c.width - R.W * Game.viewScale) / 2;
    Game.viewY = (c.height - R.H * Game.viewScale) / 2;

    // Publish the letterboxed view rect in CSS pixels so the overlay buttons
    // can sit against the canvas edge instead of the screen edge.
    const stage = c.parentElement;
    stage.style.setProperty('--view-w', (R.W * scale) + 'px');
    stage.style.setProperty('--view-h', (R.H * scale) + 'px');
    stage.style.setProperty('--view-x', ((rect.width - R.W * scale) / 2) + 'px');
    stage.style.setProperty('--view-y', ((rect.height - R.H * scale) / 2) + 'px');
    stage.style.setProperty('--view-s', scale);

  // ------------------------------------------------------------ fight setup
  Game.startFight = function (floor, opts) {
    const o = opts || {};
    Game.trainingMode = !!o.training;

    const gear = buildGearVisual();
    const player = new Fighter({
      name: 'You', isPlayer: true, x: 300, facing: 1,
      colors: { body: '#f2f4f8', accent: '#6ea8ff' },
      stats: stats, gear: gear, scale: 1,
      specials: Progress.unlockedSpecials(),
    });
    player.y = BOUNDS.ground;

    const bossStats = {
      maxHp: info.hp, atkMul: info.atkMul, def: info.def, dr: info.dr,
      spdMul: info.speed / 178, aspdMul: 1 + Math.min(0.5, floor * 0.006),
      crit: Math.min(0.35, 0.02 + floor * 0.003), critDmg: 1.5,
      rageMul: 1 + floor * 0.01, lifesteal: info.final ? 0.08 : 0,
    };
    const boss = new Fighter({
      name: info.name, x: 660, facing: -1,
      colors: info.colors, stats: bossStats, scale: info.scale,
      gear: bossGearVisual(info),
      specials: [],
    });

  function buildGearVisual() {
    const eq = Progress.data.equipped;
    const Shop = root.ST.Shop;
    const item = (id) => (id ? Shop.ITEM_BY_ID[id] : null);
    const w = item(eq.weapon), a = item(eq.armor), h = item(eq.head), b = item(eq.boots), gl = item(eq.gloves), ch = item(eq.charm);
    const tierColor = ['#b8b8b8', '#c9a227', '#9fb4c7', '#d68c45', '#7ee787', '#6ee7ff', '#c77dff', '#ffd166'];
    return {
      weaponTier: w ? w.tier : 0, weaponColor: w ? tierColor[w.tier - 1] : null,
      armor: !!a, armorColor: a ? tierColor[a.tier - 1] : null, armorTier: a ? a.tier : 0,
      head: !!h, headColor: h ? tierColor[h.tier - 1] : null, headTier: h ? h.tier : 0,
      boots: !!b, bootTier: b ? b.tier : 0,

      charm: !!ch, charmColor: ch ? tierColor[ch.tier - 1] : null,

    const t = Math.min(8, Math.max(1, Math.ceil(info.floor / 13)));

      armor: info.floor > 10, armorColor: info.colors.accent, armorTier: t,

      boots: info.floor > 16, bootTier: t,

    Game.last = now;

      const scale = Game.slowmo > 0 ? 0.32 : 1;
      Game.update(raw * scale);

  Game.update = function (dt) {

      if (Game.comboTimer <= 0) { Game.comboCount = 0; Game.comboDamage = 0; }

    pushApart();
    updateCamera(dt);
    R.updateFx(dt);
    decayShake(dt);

    if (!p.alive() || !b.alive()) {
      if (!p.alive() && !b.alive()) Game.endMatch('win', 'DOUBLE K.O.');
      else if (!b.alive()) Game.endMatch('win', 'K.O.');
      else Game.endMatch('lose', 'K.O.');
    }
  };

  function stepFighters(dt, endMode) {
    const p = Game.player, b = Game.boss;
    p.update(dt, BOUNDS, b);
    b.update(dt, BOUNDS, p);
    if (!endMode) {
      if (p.dashTimer > 8) R.FX.trail(p.x, p.y, '#6ea8ff', p.scale);
      if (b.dashTimer > 8) R.FX.trail(b.x, b.y, b.colors.body, b.scale);
      if (p.state === 'special') R.FX.trail(p.x, p.y, '#ffd166', p.scale);
    }
  }

  function decayShake(dt) {
    Game.shake = Math.max(0, Game.shake - dt * 42);
    Game.shakeX = (Math.random() - 0.5) * Game.shake;
    Game.shakeY = (Math.random() - 0.5) * Game.shake * 0.6;
  }

  function pushApart() {
    const p = Game.player, b = Game.boss;
    const minDist = 42 * ((p.scale + b.scale) / 2);
    const d = b.x - p.x;
    const ad = Math.abs(d);
    if (ad < minDist && p.onGround && b.onGround) {
      const push = (minDist - ad) / 2;
      const s = U.sign(d) || 1;
      p.x -= push * s; b.x += push * s;
      p.x = U.clamp(p.x, BOUNDS.left, BOUNDS.right);
      b.x = U.clamp(b.x, BOUNDS.left, BOUNDS.right);
    }
  }

  function updateCamera(dt) {
    const p = Game.player, b = Game.boss;
    const d = Math.abs(p.x - b.x);
    const targetZoom = U.clamp(1.32 - d / 700, 1.0, 1.24);
    Game.zoom = U.lerp(Game.zoom, targetZoom, dt * 2.4);
    const mid = (p.x + b.x) / 2;
    const viewW = R.W / Game.zoom;
    Game.camX = U.clamp(mid, viewW / 2, R.W - viewW / 2);
  }

  // -------------------------------------------------------- player controls
  let lastTap = { dir: 0, t: -999 };

  function playerIntent(p, b) {
    const dir = (Input.down('right') ? 1 : 0) + (Input.down('left') ? -1 : 0);
    const intent = {
      dir,
      crouch: Input.down('down'),
      jump: Input.pressed('up'),
      block: Input.down('block'),
      button: null,
      special: null,
      dashDir: 0,
    };

    // double-tap dash
    if (Input.pressed('right') || Input.pressed('left')) {
      const d = Input.pressed('right') ? 1 : -1;
      const now = performance.now();
      if (lastTap.dir === d && now - lastTap.t < 280) { intent.dashDir = d; lastTap.t = -999; }
      else { lastTap = { dir: d, t: now }; }
    }

    if (Input.pressed('potion')) useTonic();

    let btn = null;
    if (Input.pressed('p1')) btn = 'P1';
    else if (Input.pressed('p2')) btn = 'P2';
    else if (Input.pressed('kick')) btn = 'K';

    if (btn) {
      const spec = matchSpecial(p);
      if (spec) {
        intent.special = spec;
        if (p.meter < spec.cost) {
          intent.special = null;
          intent.button = btn;
          R.FX.text(p.x, p.y - 130, 'NO RAGE', '#ff5c7c', 16);
          Audio.play('deny');
        }
      } else {
        intent.button = btn;
      }
    }
    return intent;
  }

  /* Match the recent input history against unlocked combo recipes. Button-only
   * recipes ignore direction inputs so walking doesn't break your string. */
  function matchSpecial(p) {
    const tokens = Input.recentTokens(p.facing);
    if (!tokens.length) return null;
    const buttonsOnly = tokens.filter((t) => t === 'P1' || t === 'P2' || t === 'K');
    const list = Moves.SPECIALS_BY_LENGTH;
    for (let i = 0; i < list.length; i++) {
      const sp = list[i];
      if (sp.unlock > Progress.data.level) continue;
      const src = sp.motion ? tokens : buttonsOnly;
      if (src.length < sp.seq.length) continue;
      const tail = src.slice(src.length - sp.seq.length);
      let ok = true;
      for (let k = 0; k < sp.seq.length; k++) if (tail[k] !== sp.seq[k]) { ok = false; break; }
      if (ok) {
        Input.clearBuffer();
        return sp;
      }
    }
    return null;
  }

  function useTonic() {
    const p = Game.player;
    if (Game.tonics <= 0 || !p.canAct()) return;
    Game.tonics--;
    if (!Game.trainingMode) { Progress.data.tonics--; Progress.save(); }
    p.heal(Math.round(p.maxHp * 0.35));
    R.FX.text(p.x, p.y - 130, '+' + Math.round(p.maxHp * 0.35) + ' HP', '#7ee787', 20);
    R.FX.ring(p.x, p.y - 55, '#7ee787', 8, 70, 0.4);
    root.ST.UI.syncTonics();
  }
  Game.useTonic = useTonic;

  // ------------------------------------------------------------ projectiles
  function updateProjectiles(dt) {
    const p = Game.player;
    // spawn from special definitions
    [Game.player, Game.boss].forEach((f) => {
      if (f.state === 'special' && f.special && f.special.projectile && !f.projectileFired) {
        const pr = f.special.projectile;
        if (f.frame >= pr.f) {
          f.projectileFired = true;
          Game.projectiles.push({
            owner: f, x: f.x + f.facing * 40, y: f.y - pr.y, vx: f.facing * pr.speed,
            w: pr.w, h: pr.h, dmg: pr.dmg, life: pr.life,
            color: f.isPlayer ? '#9ad0ff' : f.colors.accent,
          });
          R.FX.ring(f.x + f.facing * 40, f.y - pr.y, '#9ad0ff', 6, 60, 0.3);
        }
      }
    });

    for (let i = Game.projectiles.length - 1; i >= 0; i--) {
      const pr = Game.projectiles[i];
      pr.x += pr.vx * dt;
      pr.life -= dt;
      const target = pr.owner === Game.player ? Game.boss : Game.player;
      const box = { x: pr.x - pr.w / 2, y: pr.y - pr.h / 2, w: pr.w, h: pr.h };
      if (U.aabb(box, target.hurtbox())) {
        const hit = { data: { dmg: pr.dmg, guard: 'mid', hitstun: 18, blockstun: 12, kb: 180, meter: 4, special: true, pushback: 40 } };
        const res = target.receiveHit(pr.owner, hit, comboScale(target));
        onHitResolved(pr.owner, target, hit, res, pr.x, pr.y);
        Game.projectiles.splice(i, 1);
        continue;
      }
      if (pr.life <= 0 || pr.x < BOUNDS.left - 80 || pr.x > BOUNDS.right + 80) Game.projectiles.splice(i, 1);
    }
  }

  // ------------------------------------------------------------- hit checks
  function comboScale(defender) {
    const chain = defender.chainTimer > 0 ? defender.chain : 0;
    return Math.max(0.35, Math.pow(0.9, chain));
  }

  function resolveHits() {
    const pair = [[Game.player, Game.boss], [Game.boss, Game.player]];
    pair.forEach(([atk, def]) => {
      if (!atk.alive() || !def.alive()) return;
      const hits = atk.activeHits();
      if (!hits.length) return;
      const hurt = def.hurtbox();
      hits.forEach((h) => {
        if (!U.aabb(h.box, hurt)) return;
        atk.markHitUsed(h.key);
        const res = def.receiveHit(atk, h, comboScale(def));
        const cx = U.clamp((h.box.x + h.box.w / 2 + hurt.x + hurt.w / 2) / 2, 0, R.W);
        const cy = (h.box.y + h.box.h / 2 + hurt.y + hurt.h / 2) / 2;
        onHitResolved(atk, def, h, res, cx, cy);
      });
    });
  }

  function onHitResolved(atk, def, h, res, cx, cy) {
    const d = h.data;
    if (res.result === 'miss') return;

    if (res.result === 'block' || res.result === 'guardbreak') {
      R.FX.spark(cx, cy, 6, '#9ad0ff', 140);
      R.FX.ring(cx, cy, '#9ad0ff', 4, 26, 0.18);
      Game.hitstop = Math.max(Game.hitstop, 0.035);
      Game.shake = Math.max(Game.shake, 3);
      if (res.result === 'guardbreak') {
        R.FX.text(cx, cy - 40, 'GUARD BREAK', '#ffd166', 22);
        Game.hitstop = 0.14;
        Game.shake = 14;
      }
      return;
    }

    // clean hit
    const heavy = d.dmg >= 14 || d.special;
    def.chain = (def.chainTimer > 0 ? def.chain : 0) + 1;
    def.chainTimer = 1.1;

    R.FX.spark(cx, cy, heavy ? 14 : 8, res.crit ? '#ffd166' : '#fff3b0', heavy ? 280 : 180);
    R.FX.ring(cx, cy, res.crit ? '#ffd166' : '#ffffff', 4, heavy ? 60 : 36, 0.2);
    if (d.shock) R.FX.shock(cx, cy, '#ffd166');

    Game.hitstop = Math.max(Game.hitstop, heavy ? 0.085 : 0.045);
    Game.shake = Math.max(Game.shake, heavy ? 12 : 6);

    if (atk === Game.player) {
      Game.comboCount = def.chain;
      Game.comboDamage += res.dmg;
      Game.comboTimer = 1.4;
      if (def.chain > Game.bestCombo) Game.bestCombo = def.chain;
      R.FX.text(cx, cy - 30, (res.crit ? 'CRIT ' : '') + Math.round(res.dmg), res.crit ? '#ffd166' : '#ffffff', res.crit ? 24 : 18);
    } else {
      R.FX.text(cx, cy - 30, '-' + Math.round(res.dmg), '#ff7b7b', 16);
    }

    if (res.knockdown) R.FX.dust(def.x, BOUNDS.ground, -def.facing);
  }

  // ------------------------------------------------------------- match end
  Game.setAnnounce = function (text, sub, seconds, color) {
    Game.announce = text;
    Game.announceSub = sub || null;
    Game.announceT = seconds;
    Game.announceMax = seconds;
    Game.announceColor = color || '#ffd166';
  };

  Game.endMatch = function (result, label) {
    if (Game.state === 'over') return;
    Game.state = 'over';
    Game.result = result;
    Game.endTimer = 2.6;
    Game.slowmo = 1.1;
    Game.shake = 16;
    const perfect = result === 'win' && Game.player.damageTaken === 0;
    Game.setAnnounce(label || 'K.O.', perfect ? 'PERFECT' : null, 2.4, result === 'win' ? '#7ee787' : '#ff5c7c');
    const winner = result === 'win' ? Game.player : Game.boss;
    const loser = result === 'win' ? Game.boss : Game.player;
    if (loser.alive()) loser.toKO();
    winner.state = 'win'; winner.setAnim('win');
    Audio.duck(0.2, 2);
  };

  Game.finish = function () {
    Audio.stopMusic();
    const info = Game.bossInfo;
    const perfect = Game.result === 'win' && Game.player.damageTaken === 0;
    const fast = Game.result === 'win' && Game.timer > Game.clock * 0.5;
    const first = Game.result === 'win' && info.floor >= Progress.data.highest;

    let payload;
    if (Game.trainingMode) {
      const reward = Progress.rewardFor(info.floor, { perfect, fast, first: false });
      const coins = Math.round(reward.coins * 0.4);
      if (Game.result === 'win') {
        Progress.data.coins += coins;
        Progress.data.stats.coinsEarned += coins;
        Progress.addXp(Math.round(reward.xp * 0.3));
        Progress.save();
      }
      payload = { training: true, result: Game.result, coins: Game.result === 'win' ? coins : 0, xp: 0, levels: [], perfect, fast, first: false, floor: info.floor, bestCombo: Game.bestCombo };
    } else if (Game.result === 'win') {
      const reward = Progress.rewardFor(info.floor, { perfect, fast, first });
      const levels = Progress.recordWin(info.floor, reward, { perfect, bestCombo: Game.bestCombo });
      payload = { result: 'win', reward, levels, perfect, fast, first, floor: info.floor, bestCombo: Game.bestCombo };
      Audio.play(info.floor % 10 === 0 ? 'floorUp' : 'coin');
      if (levels.length) setTimeout(() => Audio.play('levelUp'), 400);
    } else {
      Progress.recordLoss();
      const consolation = Math.round((40 + info.floor * 6) * Progress.combat().coinMul);
      Progress.data.coins += consolation;
      Progress.data.stats.coinsEarned += consolation;
      Progress.save();
      payload = { result: 'lose', coins: consolation, floor: info.floor, bestCombo: Game.bestCombo };
    }
    Game.screen = 'result';
    Input.releaseAll();
    root.ST.UI.showResult(payload);
  };

  Game.togglePause = function () {
    if (Game.screen !== 'fight' || Game.state === 'over') return;
    Game.paused = !Game.paused;
    root.ST.UI.setPaused(Game.paused);
    Input.releaseAll();
  };

  Game.quitFight = function () {
    Audio.stopMusic();
    Game.paused = false;
    root.ST.UI.setPaused(false);
    Input.releaseAll();
    Game.screen = 'tower';
    root.ST.UI.show('tower');
  };

  Game.showHint = function () {
    if (!Game.settings.showHints) return;
    const specials = Progress.unlockedSpecials().filter((s) => !s.motion);
    if (!specials.length) return;
    const sp = specials[Math.floor(Math.random() * specials.length)];
    Game.hint = 'COMBO: ' + sp.seq.map(btnLabel).join(' → ') + '  =  ' + sp.name;
    Game.hintT = 5.5;
  };

  function btnLabel(b) { return b === 'P1' ? 'PUNCH 1' : b === 'P2' ? 'PUNCH 2' : b === 'K' ? 'KICK' : b; }
  Game.btnLabel = btnLabel;

  // ----------------------------------------------------------------- draw
  Game.draw = function () {
    const ctx = Game.ctx;
    if (!ctx) return;
    const c = Game.canvas;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, c.width, c.height);

    ctx.save();
    ctx.translate(Game.viewX, Game.viewY);
    ctx.scale(Game.viewScale, Game.viewScale);
    ctx.beginPath(); ctx.rect(0, 0, R.W, R.H); ctx.clip();

    if (Game.screen === 'fight' && Game.player) {
      drawFight(ctx);
    } else {
      drawMenuBackdrop(ctx);
    }

    ctx.restore();
  };

  function drawFight(ctx) {
    const zoom = Game.zoom || 1;
    const camX = Game.camX === undefined ? R.W / 2 : Game.camX;

    ctx.save();
    ctx.translate(R.W / 2, R.H * 0.56);
    ctx.scale(zoom, zoom);
    ctx.translate(-camX + Game.shakeX, -R.H * 0.56 + Game.shakeY);

    R.drawBackground(ctx, Game.bossInfo.tier, Game.t, Game.shakeX);

    const order = Game.player.y <= Game.boss.y ? [Game.boss, Game.player] : [Game.player, Game.boss];
    order.forEach((f) => R.drawFighter(ctx, f, { debug: Game.settings.debug }));

    Game.projectiles.forEach((pr) => R.drawProjectile(ctx, pr, Game.t));
    R.drawFx(ctx);

    ctx.restore();

    // vignette
    const vg = ctx.createRadialGradient(R.W / 2, R.H / 2, R.H * 0.35, R.W / 2, R.H / 2, R.H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, R.W, R.H);

    HUD.draw(ctx, Game);

    if (Game.state === 'intro' && Game.introT > 1.2) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 180, R.W, 150);
      ctx.textAlign = 'center';
      ctx.fillStyle = Game.bossInfo.colors.body;
      ctx.font = '900 44px system-ui, sans-serif';
      ctx.fillText(Game.bossInfo.name.toUpperCase(), R.W / 2, 236);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '600 18px system-ui, sans-serif';
      ctx.fillText(Game.bossInfo.title, R.W / 2, 264);
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      ctx.font = 'italic 500 16px system-ui, sans-serif';
      ctx.fillText('"' + Game.bossInfo.taunt + '"', R.W / 2, 296);
      ctx.restore();
    }
  }

  /* Animated backdrop behind the menus so the app never looks static. */
  function drawMenuBackdrop(ctx) {
    const t = performance.now() / 1000;
    const floor = Progress.data ? Progress.data.floor : 1;
    const tier = Floors.tierOf(floor);
    R.drawBackground(ctx, tier, t, 0);
    const demo = Game.demoFighter || (Game.demoFighter = makeDemoFighter());
    demo.animT = t;
    const cycle = (t % 9);
    demo.anim = cycle < 3 ? 'idle' : cycle < 4.4 ? 'walk' : cycle < 5.4 ? 'jump' : cycle < 6.6 ? 'idle' : 'win';
    demo.vy = cycle >= 4.4 && cycle < 5.4 ? -100 : 0;
    demo.y = R.GROUND_Y - (cycle >= 4.4 && cycle < 5.4 ? Math.sin((cycle - 4.4) * Math.PI) * 90 : 0);
    demo.x = 170 + Math.sin(t * 0.6) * 40;
    demo.gear = buildGearVisual();
    R.drawFighter(ctx, demo, {});
    ctx.fillStyle = 'rgba(4,6,12,0.55)';
    ctx.fillRect(0, 0, R.W, R.H);
  }

  function makeDemoFighter() {
    const f = new Fighter({
      name: 'demo', isPlayer: true, x: 180, facing: 1,
      colors: { body: '#f2f4f8', accent: '#6ea8ff' },
      stats: { maxHp: 100, atkMul: 1, dr: 0, spdMul: 1, aspdMul: 1, crit: 0, critDmg: 1, rageMul: 1 },
      gear: {},
    });
    f.y = R.GROUND_Y;
    return f;
  }

  Game.BOUNDS = BOUNDS;
  Game.FIGHT_SECONDS = FIGHT_SECONDS;
  root.ST = root.ST || {};
  root.ST.Game = Game;
})(window);

</script>
<script>
(function () {
  function boot() {
    var canvas = document.getElementById('game');
    var touch = document.getElementById('touch');
    var ui = document.getElementById('ui');
    ST.UI.init(ui, touch);
    ST.Game.init(canvas, touch);
    ST.UI.show('title');

    // Audio can only start after a real gesture (iOS rule).
    ['pointerdown', 'keydown'].forEach(function (evt) {
      document.addEventListener(evt, function once() {
        ST.Audio.unlock();
        document.removeEventListener(evt, once);
      });
    });

    // Stop iOS rubber-banding and double-tap zoom during a fight.
    document.addEventListener('touchmove', function (e) {
      if (ST.Game.screen === 'fight') e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') boot();
  else window.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
