<style>
/* Stickman Tower — layout + arcade UI skin.
   Sized for phones first: everything uses safe-area insets and clamp(). */

:root {
  --bg: #05060a;
  --panel: rgba(14, 18, 30, 0.92);
  --panel-2: rgba(22, 28, 44, 0.9);
  --line: rgba(255, 255, 255, 0.12);
  --text: #eef2fb;
  --dim: rgba(238, 242, 251, 0.6);
  --gold: #ffd166;
  --green: #7ee787;
  --red: #ff5c7c;
  --blue: #6ea8ff;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%;
}

/* 100vh (not dvh/%) is the one that behaves from a cold start on iOS. */
#app { position: fixed; inset: 0; height: 100vh; width: 100vw; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hidden { display: none !important; }

/* ------------------------------------------------------------- touch pad */
.touch {
  position: absolute; inset: 0; z-index: 20; touch-action: none;
  --bs: clamp(50px, 11vh, 82px);
}

.pad, .atk {
  position: absolute;
  bottom: calc(10px + var(--safe-b));
  display: grid;
  grid-template-columns: repeat(3, var(--bs));
  grid-template-rows: repeat(3, var(--bs));
  gap: 4px;
}
.pad { left: calc(10px + var(--safe-l)); }
.atk { right: calc(10px + var(--safe-r)); }

.pb, .ab {
  -webkit-appearance: none; appearance: none;
  border: 2px solid rgba(255, 255, 255, 0.28);
  background: rgba(18, 24, 40, 0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: #fff;
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 800;
  line-height: 1;
  touch-action: none;
  transition: transform .05s ease, background .05s ease;
  padding: 0;
}
.pb span, .ab span { font-size: clamp(16px, 3.4vh, 24px); }
.pb i, .ab i { font-style: normal; font-size: clamp(7px, 1.3vh, 9px); opacity: .65; margin-top: 3px; letter-spacing: .06em; }

.pb.up { grid-area: 1 / 2; }
.pb.left { grid-area: 2 / 1; }
.pb.right { grid-area: 2 / 3; }
.pb.down { grid-area: 3 / 2; }

.ab.p2 { grid-area: 1 / 2; background: rgba(60, 90, 160, 0.42); }
.ab.p1 { grid-area: 2 / 1; background: rgba(60, 90, 160, 0.42); }
.ab.k  { grid-area: 2 / 3; background: rgba(160, 70, 60, 0.42); }
.ab.blk { grid-area: 3 / 2; background: rgba(60, 130, 120, 0.36); }

.pb.is-down, .ab.is-down {
  transform: scale(0.9);
  background: rgba(255, 255, 255, 0.34);
  border-color: #fff;
}

/* Tonic sits above the movement pad: always reachable, never over the HUD. */
.tonic {
  position: absolute;
  left: calc(14px + var(--safe-l));
  bottom: calc(14px + var(--safe-b) + 3 * var(--bs, 64px));
  width: clamp(40px, 7vh, 54px); height: clamp(40px, 7vh, 54px);
  border-radius: 50%;
  border: 2px solid rgba(126, 231, 135, 0.7);
  background: rgba(20, 40, 28, 0.55);
  color: var(--green); font-size: 26px; font-weight: 800; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
.tonic .badge {
  position: absolute; bottom: -4px; right: -4px;
  background: var(--green); color: #052610;
  font-size: 11px; border-radius: 10px; padding: 1px 6px;
}
.tonic.empty { opacity: .35; }
.tonic.is-down { transform: scale(.9); }

/* Pause hugs the canvas view (not the screen) so it never lands on the
   boss health bar, whatever the device aspect ratio is. */
.pausebtn {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(var(--view-y, 0px) + 78px * var(--view-s, 1));
  width: clamp(34px, 5vh, 42px); height: clamp(30px, 4vh, 34px);
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(12, 16, 26, 0.6);
  color: #fff; font-size: 13px;
  touch-action: none;
}

/* ------------------------------------------------------------ UI screens */
.ui {
  position: absolute; inset: 0; z-index: 30;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) calc(20px + var(--safe-b)) calc(10px + var(--safe-l));
}

.screen { max-width: 980px; margin: 0 auto; }

h1, h2, h3 { margin: 0 0 8px; }
h2 { font-size: clamp(15px, 2.4vh, 20px); margin-top: 20px; letter-spacing: .02em; }
h2 small { font-weight: 500; font-size: 12px; color: var(--dim); margin-left: 8px; }
h3 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; margin-top: 14px; }
.note { color: var(--dim); font-size: 13px; line-height: 1.5; }

button { font-family: inherit; cursor: pointer; }

.big {
  display: block; width: 100%;
  padding: 13px 18px; margin: 8px 0;
  font-size: clamp(13px, 2vh, 16px); font-weight: 800; letter-spacing: .06em;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.big.primary { background: linear-gradient(180deg, #3c6bd6, #2a4ea3); border-color: #7aa4ff; }
.big.ghost { background: transparent; }
.big.danger { background: rgba(90, 20, 34, .7); border-color: var(--red); color: #ffc9d4; }
.big:active { transform: translateY(1px); }
.row { display: flex; gap: 10px; }
.row .big { margin-top: 4px; }

/* top bar */
.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 10px; margin-bottom: 4px;
  position: sticky; top: 0; z-index: 5;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.tb-left, .tb-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stat { font-size: 12px; color: var(--dim); }
.stat b { color: var(--gold); font-size: 14px; }
.stat i { font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.chip {
  background: rgba(255, 255, 255, .06); border: 1px solid var(--line);
  color: var(--text); border-radius: 8px; padding: 6px 10px;

<script>
/* ===== src/util.js ===== */
/* Stickman Tower — shared helpers
 * Loaded as a classic script so the game also runs from file:// (no module CORS).
 */
(function (root) {
  'use strict';

  const U = {};

  U.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
  U.rad = (deg) => (deg * Math.PI) / 180;

  // Move `v` toward `target` by at most `step`.
  U.approach = (v, target, step) => {
    if (v < target) return Math.min(v + step, target);
    if (v > target) return Math.max(v - step, target);
    return target;
  };

  // Smoothstep-ish easing used by pose interpolation.
  U.ease = (t) => t * t * (3 - 2 * t);
  U.easeOut = (t) => 1 - (1 - t) * (1 - t);
  U.easeIn = (t) => t * t;

  // Deterministic PRNG so every floor generates the same boss on every device.
  U.rng = function (seed) {
    let a = seed >>> 0;
    const fn = function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    fn.range = (lo, hi) => lo + fn() * (hi - lo);
    fn.int = (lo, hi) => Math.floor(lo + fn() * (hi - lo + 1));
    fn.pick = (arr) => arr[Math.floor(fn() * arr.length) % arr.length];
    fn.chance = (p) => fn() < p;
    return fn;
  };

  U.aabb = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  U.rectCenter = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

  // 12345 -> "12,345"
  U.comma = (n) => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  U.pad2 = (n) => (n < 10 ? '0' + n : '' + n);

  U.time = (seconds) => {
    const s = Math.max(0, Math.ceil(seconds));
    return U.pad2(Math.floor(s / 60)) + ':' + U.pad2(s % 60);
  };

  // Roman numerals for equipment tiers (I..X).
  U.roman = (n) => ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][n] || String(n);

  U.storage = {
    read(key, fallback) {
      try {
        const raw = root.localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },
    write(key, value) {
      try {
        root.localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        return false;
      }
    },
    remove(key) {
      try { root.localStorage.removeItem(key); } catch (e) { /* private mode */ }
    },
  };

  root.ST = root.ST || {};
  root.ST.U = U;
})(window);

/* ===== src/audio.js ===== */
/* Stickman Tower — all sound is synthesised at runtime (no asset downloads,
 * so the whole game stays installable as a handful of small files). */
(function (root) {
  'use strict';

  const Audio = {
    ctx: null,
    master: null,
    musicGain: null,
    sfxGain: null,
    enabled: true,
    musicOn: true,
    unlocked: false,
    _musicTimer: null,
    _step: 0,
    _scale: null,
    _tempo: 0.26,
  };

  function ensure() {
    if (Audio.ctx) return Audio.ctx;
    const Ctx = root.AudioContext || root.webkitAudioContext;
    if (!Ctx) return null;
    Audio.ctx = new Ctx();
    Audio.master = Audio.ctx.createGain();
    Audio.master.gain.value = 0.9;
    Audio.master.connect(Audio.ctx.destination);
    Audio.sfxGain = Audio.ctx.createGain();
    Audio.sfxGain.gain.value = 0.8;
    Audio.sfxGain.connect(Audio.master);
    Audio.musicGain = Audio.ctx.createGain();
    Audio.musicGain.gain.value = 0.22;
    Audio.musicGain.connect(Audio.master);
    return Audio.ctx;
  }

  /* iOS/Safari only allow audio after a real user gesture. */
  Audio.unlock = function () {
    const ctx = ensure();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (!Audio.unlocked) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      g.gain.value = 0.0001;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.02);
      Audio.unlocked = true;
    }
  };

  let noiseBuffer = null;
  function noise() {
    const ctx = ensure();
    if (!noiseBuffer) {
      noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    return src;
  }

  function tone(freq, dur, type, vol, slideTo, dest) {
    const ctx = ensure();
    if (!ctx || !Audio.enabled) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || Audio.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function burst(dur, vol, freq, q, type) {
    const ctx = ensure();
    if (!ctx || !Audio.enabled) return;
    const t = ctx.currentTime;
    const src = noise();
    const filt = ctx.createBiquadFilter();
    filt.type = type || 'bandpass';
    filt.frequency.setValueAtTime(freq, t);
    filt.frequency.exponentialRampToValueAtTime(Math.max(80, freq * 0.35), t + dur);
    filt.Q.value = q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(Audio.sfxGain);
    src.start(t); src.stop(t + dur + 0.02);
  }

  const SFX = {
    whiffLight() { burst(0.09, 0.10, 2600, 1.2); },
    whiffHeavy() { burst(0.16, 0.15, 1500, 0.9); },
    hitLight() { burst(0.10, 0.35, 1800, 0.8); tone(150, 0.11, 'square', 0.22, 60); },
    hitHeavy() { burst(0.18, 0.5, 900, 0.7); tone(96, 0.2, 'square', 0.34, 42); },
    hitSpecial() { burst(0.26, 0.55, 600, 0.6); tone(140, 0.3, 'sawtooth', 0.3, 48); tone(320, 0.22, 'square', 0.16, 90); },
    block() { burst(0.08, 0.3, 5200, 4); tone(680, 0.06, 'square', 0.12, 520); },
    guardBreak() { burst(0.3, 0.4, 2200, 2); tone(220, 0.4, 'sawtooth', 0.24, 70); },
    jump() { tone(300, 0.13, 'sine', 0.14, 620); },
    land() { burst(0.08, 0.16, 380, 1.4); },
    knockdown() { burst(0.3, 0.4, 320, 0.7); tone(70, 0.35, 'sine', 0.3, 35); },
    ko() {
      tone(420, 0.5, 'sawtooth', 0.3, 60);
      setTimeout(() => tone(300, 0.7, 'square', 0.26, 40), 90);
      setTimeout(() => burst(0.7, 0.35, 500, 0.5), 120);
    },
    coin() { tone(1180, 0.07, 'square', 0.16); setTimeout(() => tone(1760, 0.12, 'square', 0.14), 60); },
    levelUp() {
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.22), i * 80));
    },
    buy() { tone(520, 0.08, 'square', 0.16); setTimeout(() => tone(780, 0.12, 'square', 0.16), 70); },
    deny() { tone(180, 0.16, 'square', 0.2, 120); },
    ui() { tone(880, 0.05, 'triangle', 0.10); },
    fight() { tone(330, 0.18, 'square', 0.28); setTimeout(() => tone(660, 0.3, 'square', 0.3), 160); },
    meterFull() { tone(700, 0.1, 'triangle', 0.16); setTimeout(() => tone(1050, 0.16, 'triangle', 0.16), 80); },
    potion() { tone(500, 0.1, 'sine', 0.2, 900); setTimeout(() => tone(900, 0.18, 'sine', 0.16, 1300), 80); },
    floorUp() {
      [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.26, 'triangle', 0.2), i * 90));
    },
  };

  Audio.play = function (name) {
    if (!Audio.enabled) return;
    const fn = SFX[name];
    if (fn) { ensure(); fn(); }
  };

  // ------------------------------------------------------------ music bed
  const SCALES = [
    [220.00, 261.63, 293.66, 329.63, 392.00, 440.00],           // A minor pentatonic-ish
    [196.00, 233.08, 261.63, 293.66, 349.23, 392.00],           // G phrygian colour
    [246.94, 293.66, 329.63, 369.99, 440.00, 493.88],           // B dorian
    [174.61, 207.65, 233.08, 261.63, 311.13, 349.23],           // F sombre
  ];

  Audio.startMusic = function (tier) {
    Audio.stopMusic();
    if (!Audio.musicOn || !Audio.enabled) return;
    const ctx = ensure();
    if (!ctx) return;
    Audio._scale = SCALES[(tier || 0) % SCALES.length];
    Audio._tempo = 0.30 - Math.min(0.10, (tier || 0) * 0.012);
    Audio._step = 0;
    const tick = () => {
      if (!Audio.musicOn || !Audio.enabled) return;
      const s = Audio._step++;
      const sc = Audio._scale;
      const rootNote = sc[0] / 2;
      if (s % 4 === 0) tone(rootNote, Audio._tempo * 2.2, 'triangle', 0.22, null, Audio.musicGain);
      if (s % 8 === 4) tone(rootNote * 1.5, Audio._tempo * 1.6, 'triangle', 0.16, null, Audio.musicGain);
      const note = sc[(s * 3 + (s % 5)) % sc.length] * (s % 16 < 8 ? 1 : 1.5);
      tone(note, Audio._tempo * 0.85, 'square', 0.055, null, Audio.musicGain);
      if (s % 2 === 0) burstMusic(0.05, 0.035, 6000);
      if (s % 8 === 0) burstMusic(0.12, 0.09, 200, 'lowpass');
    };
    tick();
    Audio._musicTimer = setInterval(tick, Audio._tempo * 1000);
  };

  function burstMusic(dur, vol, freq, type) {
    const ctx = ensure();
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = noise();
    const filt = ctx.createBiquadFilter();
    filt.type = type || 'highpass';
    filt.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(Audio.musicGain);
    src.start(t); src.stop(t + dur + 0.02);
  }

  Audio.stopMusic = function () {
    if (Audio._musicTimer) { clearInterval(Audio._musicTimer); Audio._musicTimer = null; }
  };

  Audio.setMusic = function (on) {
    Audio.musicOn = on;
    if (!on) Audio.stopMusic();
  };

  Audio.duck = function (amount, seconds) {
    if (!Audio.musicGain || !Audio.ctx) return;
    const t = Audio.ctx.currentTime;
    Audio.musicGain.gain.cancelScheduledValues(t);
    Audio.musicGain.gain.setValueAtTime(Audio.musicGain.gain.value, t);
    Audio.musicGain.gain.linearRampToValueAtTime(0.22 * amount, t + 0.05);
    Audio.musicGain.gain.linearRampToValueAtTime(0.22, t + (seconds || 0.6));
  };

  root.ST = root.ST || {};
  root.ST.Audio = Audio;
})(window);

/* ===== src/input.js ===== */
/* Stickman Tower — unified input: touch, keyboard, gamepad.
 *
 * Every source funnels into the same action set, so an iPhone with a paired
 * Bluetooth keyboard behaves exactly like a laptop.
 */
(function (root) {
  'use strict';

  const U = root.ST.U;

  const ACTIONS = ['left', 'right', 'up', 'down', 'p1', 'p2', 'kick', 'block', 'potion', 'pause'];

  const DEFAULT_KEYS = {
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW', 'Space'],
    down: ['ArrowDown', 'KeyS'],
    p1: ['KeyJ', 'KeyZ'],
    p2: ['KeyK', 'KeyX'],
    kick: ['KeyL', 'KeyC'],
    block: ['ShiftLeft', 'ShiftRight', 'KeyB'],
    potion: ['KeyQ', 'KeyE'],
    pause: ['Escape', 'KeyP', 'Enter'],
  };

  // Standard gamepad mapping (Xbox/PS/MFi all report "standard").
  const PAD_BUTTONS = {
    0: 'p1',    // A / Cross
    2: 'p2',    // X / Square
    1: 'kick',  // B / Circle
    3: 'kick',  // Y / Triangle
    4: 'block', // L1
    5: 'block', // R1
    6: 'potion',// L2
    7: 'p2',    // R2
    9: 'pause', // Start
    12: 'up', 13: 'down', 14: 'left', 15: 'right',
  };

  const BUFFER_MS = 520;    // max gap between two inputs of one combo
  const BUFFER_MAX = 12;

  const Input = {
    keys: JSON.parse(JSON.stringify(DEFAULT_KEYS)),
    held: {},
    prev: {},
    edge: {},
    buffer: [],           // [{token:'P1'|'L'|..., t: ms}]
    lastSource: 'keyboard',
    touchActive: false,
    padIndex: null,
    onPause: null,
    listening: null,      // action name while remapping
    onRebind: null,
  };

  ACTIONS.forEach((a) => { Input.held[a] = false; Input.prev[a] = false; Input.edge[a] = false; });

  const keySources = {};   // action -> Set of active sources
  function setFrom(source, action, down) {
    if (!action) return;
    if (!keySources[action]) keySources[action] = new Set();
    if (down) keySources[action].add(source);
    else keySources[action].delete(source);
    Input.held[action] = keySources[action].size > 0;
  }

  function actionForCode(code) {
    for (const a of ACTIONS) {
      if (Input.keys[a] && Input.keys[a].indexOf(code) !== -1) return a;
    }
    return null;
  }

  function pushToken(token) {
    const now = performance.now();
    Input.buffer.push({ token, t: now });
    if (Input.buffer.length > BUFFER_MAX) Input.buffer.shift();
  }

  const TOKEN_FOR = { p1: 'P1', p2: 'P2', kick: 'K', left: 'L', right: 'R', down: 'D', up: 'U' };

  // ------------------------------------------------------------- keyboard
  function onKeyDown(e) {
    if (Input.listening) {
      e.preventDefault();
      const action = Input.listening;
      Input.listening = null;
      if (e.code !== 'Escape') {
        Input.keys[action] = [e.code];
        saveBindings();
      }
      if (Input.onRebind) Input.onRebind(action, e.code);
      return;
    }
    const action = actionForCode(e.code);
    if (!action) return;
    e.preventDefault();
    Input.lastSource = 'keyboard';
    if (!e.repeat) {
      setFrom('key', action, true);
      if (TOKEN_FOR[action]) pushToken(TOKEN_FOR[action]);
      if (action === 'pause' && Input.onPause) Input.onPause();
    }
  }

  function onKeyUp(e) {
    const action = actionForCode(e.code);
    if (!action) return;
    e.preventDefault();
    setFrom('key', action, false);
  }

  // ---------------------------------------------------------------- touch
  const pointerAction = new Map();   // pointerId -> action

  function bindTouch(container) {
    const buttons = Array.prototype.slice.call(container.querySelectorAll('[data-action]'));
    if (!buttons.length) return;

    function hitTest(x, y) {
      for (const b of buttons) {
        if (b.offsetParent === null) continue;
        const r = b.getBoundingClientRect();
        // Generous padding: thumbs are imprecise, especially on a phone.
        const pad = parseFloat(b.dataset.pad || '10');
        if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return b;
      }
      return null;
    }

    function press(id, btn) {
      const action = btn.dataset.action;
      pointerAction.set(id, action);
      btn.classList.add('is-down');
      Input.lastSource = 'touch';
      Input.touchActive = true;
      setFrom('touch:' + id, action, true);
      if (TOKEN_FOR[action]) pushToken(TOKEN_FOR[action]);
      if (action === 'pause' && Input.onPause) Input.onPause();
      if (root.navigator.vibrate && root.ST.Game && root.ST.Game.settings.haptics) {
        try { root.navigator.vibrate(8); } catch (e) { /* unsupported */ }
      }
    }

    function release(id) {
      const action = pointerAction.get(id);
      if (!action) return;
      pointerAction.delete(id);
      setFrom('touch:' + id, action, false);
      buttons.forEach((b) => {
        if (b.dataset.action === action && !isActionHeldByTouch(action)) b.classList.remove('is-down');
      });
    }

    function isActionHeldByTouch(action) {
      for (const a of pointerAction.values()) if (a === action) return true;
      return false;
    }

    container.addEventListener('pointerdown', (e) => {
      const btn = hitTest(e.clientX, e.clientY);
      if (!btn) return;
      e.preventDefault();
      press(e.pointerId, btn);
    }, { passive: false });

    // Let a thumb slide from one pad button into another (left -> right).
    container.addEventListener('pointermove', (e) => {
      if (!pointerAction.has(e.pointerId)) return;
      const btn = hitTest(e.clientX, e.clientY);
      const current = pointerAction.get(e.pointerId);
      if (btn && btn.dataset.action === current) return;
      if (btn && btn.dataset.slide === 'true') {
        release(e.pointerId);
        press(e.pointerId, btn);
      } else if (!btn) {
        release(e.pointerId);
      }
    }, { passive: false });

    ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
      container.addEventListener(type, (e) => { release(e.pointerId); }, { passive: false });
    });
  }

  // -------------------------------------------------------------- gamepad
  const padPrev = {};
  function pollGamepad() {
    if (!root.navigator.getGamepads) return;
    const pads = root.navigator.getGamepads();
    for (let i = 0; i < pads.length; i++) {
      const pad = pads[i];
      if (!pad || !pad.connected) continue;
      Input.padIndex = i;
      const state = {};
      for (const idx in PAD_BUTTONS) {
        const b = pad.buttons[idx];
        if (b && b.pressed) state[PAD_BUTTONS[idx]] = true;
      }
      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
      if (ax < -0.4) state.left = true;
      if (ax > 0.4) state.right = true;
      if (ay < -0.5) state.up = true;
      if (ay > 0.4) state.down = true;

      ACTIONS.forEach((a) => {
        const down = !!state[a];
        if (down !== !!padPrev[a]) {
          setFrom('pad', a, down);
          if (down) {
            Input.lastSource = 'gamepad';
            if (TOKEN_FOR[a]) pushToken(TOKEN_FOR[a]);
            if (a === 'pause' && Input.onPause) Input.onPause();
          }
        }
        padPrev[a] = down;
      });
      return; // first connected pad wins
    }
  }

  // ----------------------------------------------------------------- API
  Input.init = function (touchContainer) {
    loadBindings();
    root.addEventListener('keydown', onKeyDown, { passive: false });
    root.addEventListener('keyup', onKeyUp, { passive: false });
    root.addEventListener('blur', Input.releaseAll);
    if (touchContainer) bindTouch(touchContainer);
    root.addEventListener('gamepadconnected', () => { Input.lastSource = 'gamepad'; });
  };

  Input.releaseAll = function () {
    ACTIONS.forEach((a) => { Input.held[a] = false; });
    for (const k in keySources) keySources[k].clear();
    pointerAction.clear();
  };

  /* Call once per rendered frame: refreshes edges + gamepad. */
  Input.update = function () {
    pollGamepad();
    ACTIONS.forEach((a) => {
      Input.edge[a] = Input.held[a] && !Input.prev[a];
      Input.prev[a] = Input.held[a];
    });
    const cutoff = performance.now() - 4000;
    while (Input.buffer.length && Input.buffer[0].t < cutoff) Input.buffer.shift();
  };

  Input.pressed = (a) => !!Input.edge[a];
  Input.down = (a) => !!Input.held[a];

  /* Tokens newest-last, converted to facing-relative F/B and gap-filtered. */
  Input.recentTokens = function (facing) {
    const out = [];
    const now = performance.now();
    let lastT = now;
    for (let i = Input.buffer.length - 1; i >= 0; i--) {
      const entry = Input.buffer[i];
      if (lastT - entry.t > BUFFER_MS) break;
      lastT = entry.t;
      let tok = entry.token;
      if (tok === 'L') tok = facing > 0 ? 'B' : 'F';
      else if (tok === 'R') tok = facing > 0 ? 'F' : 'B';
      out.unshift(tok);
    }
    return out;
  };

  Input.clearBuffer = function () { Input.buffer.length = 0; };

  Input.bindingLabel = function (action) {
    const codes = Input.keys[action] || [];
    const seen = [];
    codes.map(prettyCode).forEach((label) => {
      if (label && seen.indexOf(label) === -1) seen.push(label);   // ShiftLeft/ShiftRight both read "SHIFT"
    });
    return seen.join(' / ') || '—';
  };

  function prettyCode(code) {
    if (!code) return '—';
    if (code.indexOf('Key') === 0) return code.slice(3);
    if (code.indexOf('Digit') === 0) return code.slice(5);
    if (code.indexOf('Arrow') === 0) return { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓' }[code];
    if (code === 'Space') return 'SPACE';
    if (code === 'ShiftLeft' || code === 'ShiftRight') return 'SHIFT';
    if (code === 'Escape') return 'ESC';
    return code.toUpperCase();
  }
  Input.prettyCode = prettyCode;

  Input.listenFor = function (action, cb) {
    Input.listening = action;
    Input.onRebind = cb;
  };

  Input.resetBindings = function () {
    Input.keys = JSON.parse(JSON.stringify(DEFAULT_KEYS));
    saveBindings();
  };

  function saveBindings() { U.storage.write('st.keys.v1', Input.keys); }
  function loadBindings() {
    const saved = U.storage.read('st.keys.v1', null);
    if (saved) {
      ACTIONS.forEach((a) => { if (saved[a] && saved[a].length) Input.keys[a] = saved[a]; });
    }
  }

  Input.ACTIONS = ACTIONS;
  root.ST.Input = Input;
})(window);

    'of the Low Guard', 'of Nine Ribs', 'the Iron Jaw', 'the Whisper', 'the Landslide', 'the Firestarter',

  const ARCHETYPES = {

    speedster: { label: 'Speedster', hp: 0.78, atk: 0.85, def: 0.80, spd: 1.45, aggr: 0.85, block: 0.8, spacing: 55,  jump: 0.28, combo: 4 },
    tank:      { label: 'Tank',      hp: 1.55, atk: 1.12, def: 1.50, spd: 0.72, aggr: 0.42, block: 1.5, spacing: 60,  jump: 0.02, combo: 2 },

    trickster: { label: 'Trickster', hp: 0.88, atk: 0.98, def: 0.88, spd: 1.20, aggr: 0.68, block: 1.1, spacing: 80,  jump: 0.40, combo: 4, mixup: true },
    warden:    { label: 'Warden',    hp: 1.85, atk: 1.25, def: 1.35, spd: 1.05, aggr: 0.72, block: 1.3, spacing: 65,  jump: 0.16, combo: 4, phases: 2 },
  };

  const ORDER = ['brawler', 'speedster', 'tank', 'grappler', 'trickster', 'zoner'];

  const PALETTES = [
    { body: '#ff6b6b', accent: '#ffd166' }, { body: '#4ecdc4', accent: '#ffe66d' },
    { body: '#c77dff', accent: '#80ffdb' }, { body: '#ffa45c', accent: '#ff7b9c' },
    { body: '#7ee787', accent: '#58a6ff' }, { body: '#f2c14e', accent: '#f24e4e' },
    { body: '#6ee7ff', accent: '#ff8fab' }, { body: '#ff8fab', accent: '#b8c0ff' },
    { body: '#d0d0d0', accent: '#ff4d6d' }, { body: '#ffd60a', accent: '#003566' },
  ];

  const TAUNTS = [
    'You made it up one flight. Impressive. Genuinely.',
    'Nobody climbs past me on a weekday.',
    'I have been standing here for eleven years.',
    'Your form is bad and you should feel bad.',
    'The stairs behind me are closed for maintenance.',
    'I eat stick figures like you for breakfast. Literally. Two-dimensionally.',
    'Go home. The lift is broken anyway.',
    'This floor has a strict no-climbing policy.',
    'I was told there would be a challenge.',
    'Last guy who tried this is still on the ceiling.',
    'You brought fists to a fist fight. Bold.',
    'My guard has never been broken. My ribs, often.',
    'Floor rules: you fall, you stay.',
    'I am contractually obliged to stop you.',
    'Do you even frame data, bro?',
  ];

  const cache = {};

  function get(floor) {
    floor = U.clamp(Math.round(floor), 1, 100);
    if (cache[floor]) return cache[floor];

    const rng = U.rng(floor * 9176 + 1337);
    const tierIndex = Math.min(9, Math.floor((floor - 1) / 10));
    const tier = TIERS[tierIndex];
    const isWarden = floor % 10 === 0 && floor !== 100;
    const isFinal = floor === 100;

    let archId;
    if (isWarden || isFinal) archId = 'warden';
    else archId = ORDER[(floor + Math.floor(floor / 7)) % ORDER.length];
    const arch = ARCHETYPES[archId];

    let name;
    if (isFinal) name = 'THE ASCENDANT';
    else if (isWarden) name = WARDEN_NAMES[Math.floor(floor / 10) - 1] || 'Warden';
    else name = rng.pick(FIRST) + ' ' + rng.pick(SECOND);

    const title = isFinal ? 'Keeper of the Hundredth Floor'
      : isWarden ? 'Gatekeeper of ' + tier.name
        : rng.pick(TITLES);

    // Core stat curve: gentle early, steep late, with a bump every 10 floors.
    // Tuned against tools/balance.mjs so a boss dies inside the 99s clock and
    // the player survives longer than the boss does.
    const curve = 1 + 0.07 * floor + 0.0009 * floor * floor;
    const hp = Math.round(120 * curve * arch.hp * (isFinal ? 1.35 : 1));
    const atkMul = (1 + 0.045 * floor) * arch.atk * (isFinal ? 1.15 : 1);
    const def = Math.round(floor * 1.1 * arch.def);
    const speed = 150 * arch.spd * (1 + 0.004 * floor);

    // AI sharpens as you climb: faster reactions, tighter blocks, real combos.
    const p = U.clamp((floor - 1) / 80, 0, 1);
    const ai = {
      aggression: U.clamp(arch.aggr * (0.75 + 0.45 * p), 0.2, 0.95),
      blockChance: U.clamp((0.12 + 0.52 * p) * arch.block, 0, 0.82),
      reaction: Math.round(U.lerp(24, 5, p)),          // frames before reacting
      spacing: arch.spacing + rng.range(-12, 12),
      jumpiness: arch.jump * (0.6 + 0.8 * p),
      comboLen: Math.min(5, arch.combo + (p > 0.6 ? 1 : 0)),
      specialChance: U.clamp(p * 0.42 + (isWarden || isFinal ? 0.15 : 0), 0, 0.55),
      punishWindow: Math.round(U.lerp(3, 12, p)),
      antiAir: U.clamp(0.15 + 0.6 * p, 0, 0.8),
      whiffPunish: p > 0.35,
      projectile: !!arch.projectile && floor > 12,
      mixup: !!arch.mixup,
    };

    const pal = PALETTES[(floor * 3) % PALETTES.length];
    const colors = {
      body: isFinal ? '#ffd76e' : isWarden ? '#ff4d6d' : pal.body,
      accent: isFinal ? '#fff3c4' : pal.accent,
      aura: isFinal ? '#ffd76e' : isWarden ? '#ff4d6d' : null,
    };

    const boss = {
      floor,
      name,
      title,
      archId,
      arch: arch.label,
      warden: isWarden,
      final: isFinal,
      phases: isWarden || isFinal ? 2 : 1,
      hp,
      atkMul,
      def,
      dr: def / (def + 200),      // caps late-game boss armour near 45%
      speed,
      scale: isFinal ? 1.22 : isWarden ? 1.14 : U.clamp(0.94 + rng.range(0, 0.16) + (archId === 'tank' ? 0.1 : 0), 0.9, 1.2),
      ai,
      colors,
      tier,
      tierIndex,
      taunt: isFinal ? 'One hundred floors. Let us see what you became.' : rng.pick(TAUNTS),
      power: 0,
    };

    // A player-facing threat rating on the same scale as Progress.power(), so
    // "you 900 / boss 950" genuinely means a close fight. Boss health pools are
    // much deeper than a player's by design, hence the lighter HP weight.
    boss.power = Math.round(hp * 0.17 + atkMul * 150 + def * 1.6 + speed * 0.5 + floor * 3);
    cache[floor] = boss;
    return boss;
  }

  function tierOf(floor) { return TIERS[Math.min(9, Math.floor((U.clamp(floor, 1, 100) - 1) / 10))]; }

  root.ST = root.ST || {};
  root.ST.Floors = { get, tierOf, TIERS, ARCHETYPES };
})(window);

    // -------------------------------------------------------- derived stats

      const out = { atk: 0, def: 0, hp: 0, spd: 0, crit: 0, rage: 0, aspd: 0, coin: 0, lifesteal: 0, critdmg: 0 };
      for (const slot in P.data.equipped) {
        const id = P.data.equipped[slot];
        if (!id || !ITEM_BY_ID[id]) continue;
        const st = ITEM_BY_ID[id].stats;
        for (const k in st) out[k] += st[k];
      }
      return out;
    },

    /* The single source of truth for what the player fighter is made of. */
    combat() {
      const d = P.data;
      const g = P.gearStats();
      const lvl = d.level;
      const maxHp = 160 + d.train.hp * 12 + g.hp + (lvl - 1) * 2;
      const atkMul = (1 + d.train.atk * 0.04 + (lvl - 1) * 0.005) * (1 + g.atk / 100);
      const def = d.train.def * 3 + g.def;
      const spdMul = (1 + d.train.spd * 0.04) * (1 + g.spd / 100);
      const aspdMul = 1 + d.train.spd * 0.015 + g.aspd / 100;
      const crit = Math.min(0.75, d.train.crit * 0.02 + g.crit / 100);
      const critDmg = 1.6 + g.critdmg / 100;
      const rageMul = (1 + d.train.rage * 0.08) * (1 + g.rage / 100);
      return {
        maxHp: Math.round(maxHp),
        atkMul,
        def,
        dr: def / (def + 110),          // damage reduction 0..1
        spdMul,
        aspdMul,
        crit,
        critDmg,
        rageMul,
        lifesteal: g.lifesteal / 100,
        coinMul: 1 + g.coin / 100,
        tonics: 1 + d.train.pot,
      };
    },

    /* Rough "how strong am I" number, compared against boss power in the UI. */
    power() {
      const c = P.combat();
      return Math.round(
        c.maxHp * 0.45 + c.atkMul * 140 + c.def * 1.6 + c.crit * 120 + c.spdMul * 40 + P.data.level * 6
      );
    },

    // ------------------------------------------------------------- economy
    xpToNext(level) { return 60 + 30 * (level || P.data.level); },

    addXp(amount) {
      const d = P.data;
      d.xp += amount;
      const gained = [];
      while (d.xp >= P.xpToNext(d.level)) {
        d.xp -= P.xpToNext(d.level);
        d.level++;
        gained.push(d.level);
      }
      return gained;
    },

    /* Combos unlock with level so floor 1 isn't a wall of options. */
    unlockedSpecials() {
      return root.ST.Moves.SPECIALS.filter((s) => s.unlock <= P.data.level);
    },
    newlyUnlockedAt(level) {
      return root.ST.Moves.SPECIALS.filter((s) => s.unlock === level);
    },

    canBuyItem(item) {
      const d = P.data;
      if (d.owned.indexOf(item.id) !== -1) return 'owned';
      if (d.highest < item.floor) return 'locked';
      if (d.coins < item.cost) return 'poor';
      return 'ok';
    },

    buyItem(item) {
      if (P.canBuyItem(item) !== 'ok') return false;
      P.data.coins -= item.cost;
      P.data.owned.push(item.id);
      P.data.equipped[item.slot] = item.id;   // auto-equip: it's always an upgrade
      P.save();
      return true;
    },

    equip(item) {
      if (P.data.owned.indexOf(item.id) === -1) return false;
      P.data.equipped[item.slot] = item.id;
      P.save();
      return true;
    },

    canTrain(id) {
      const t = TRAINING_BY_ID[id];
      const lvl = P.data.train[id] || 0;
      if (lvl >= t.max) return 'max';
      if (P.data.coins < trainingCost(id, lvl)) return 'poor';
      return 'ok';
    },

    train(id) {
      if (P.canTrain(id) !== 'ok') return false;
      const lvl = P.data.train[id] || 0;
      P.data.coins -= trainingCost(id, lvl);
      P.data.train[id] = lvl + 1;
      P.save();
      return true;
    },

    buyTonic() {
      const max = P.combat().tonics;
      if (P.data.tonics >= max) return 'max';
      if (P.data.coins < TONIC_COST) return 'poor';
      P.data.coins -= TONIC_COST;
      P.data.tonics++;
      P.save();
      return 'ok';
    },

    /* Reward for clearing a floor. Perfect + speed bonuses reward clean play. */
    rewardFor(floor, opts) {
      const o = opts || {};
      const boss = root.ST.Floors.get(floor);
      const base = Math.round((90 + 26 * floor) * (boss.warden ? 2.4 : 1) * (boss.final ? 4 : 1));
      const perfect = o.perfect ? Math.round(base * 0.5) : 0;
      const speed = o.fast ? Math.round(base * 0.25) : 0;
      const first = o.first ? Math.round(base * 0.35) : 0;
      const mult = P.combat().coinMul;
      const coins = Math.round((base + perfect + speed + first) * mult);
      const xp = Math.round((40 + 14 * floor) * (boss.warden ? 2 : 1) * (boss.final ? 3 : 1));
      return { base, perfect, speed, first, coins, xp, mult };
    },

    recordWin(floor, reward, extra) {
      const d = P.data;
      d.coins += reward.coins;
      d.stats.coinsEarned += reward.coins;
      d.stats.wins++;
      if (extra && extra.perfect) d.stats.perfect++;
      if (extra && extra.bestCombo > d.stats.bestCombo) d.stats.bestCombo = extra.bestCombo;
      const levels = P.addXp(reward.xp);
      d.cleared = Math.max(d.cleared, floor);
      if (floor >= d.highest) {
        d.highest = Math.min(100, floor + 1);
        d.floor = Math.min(100, floor + 1);
      }
      P.save();
      return levels;
    },

    recordLoss() {
      P.data.stats.losses++;
      P.save();
    },
  };

  root.ST = root.ST || {};
  root.ST.Progress = P;
  root.ST.Shop = {
    TRAINING, TRAINING_BY_ID, trainingCost, SLOTS, ITEMS, ITEM_BY_ID,
    STAT_LABEL, STAT_SUFFIX, TIER_FLOOR, TONIC_COST,
  };
})(window);

/* ===== src/fighter.js ===== */
/* Stickman Tower — the fighter: physics, state machine, hit/hurt boxes.
 *
 * Player and boss share this class entirely. The only difference is who fills
 * in the `intent` each frame: the input layer, or the AI brain.
 */
(function (root) {
  'use strict';

  const U = root.ST.U;
  const Moves = root.ST.Moves;

  const GRAVITY = 2100;
  const JUMP_V = 700;
  const WALK_F = 178;
  const WALK_B = 148;
  const DASH_V = 430;
  const GROUND_FRICTION = 1500;
  const AIR_DRAG = 220;
  const MAX_GUARD = 100;
  const BUFFER_SECONDS = 0.28;   // attack input buffer window

  const HURT = {
    stand: { x: -16, y: 0, w: 32, h: 112 },
    crouch: { x: -18, y: 0, w: 36, h: 74 },
    air: { x: -16, y: 8, w: 32, h: 96 },
    down: { x: -32, y: 0, w: 64, h: 34 },
  };

  function Fighter(cfg) {
    this.name = cfg.name || 'Fighter';
    this.isPlayer = !!cfg.isPlayer;
    this.colors = cfg.colors || { body: '#eaeaea', accent: '#6ea8ff' };
    this.scale = cfg.scale || 1;
    this.gear = cfg.gear || null;          // equipped ids, for rendering
    this.stats = cfg.stats;                // combat stats block
    this.specials = cfg.specials || [];    // available special defs
    this.maxHp = this.stats.maxHp;
    this.reset(cfg.x || 0, cfg.facing || 1);
  }

  Fighter.prototype.reset = function (x, facing) {
    this.x = x;
    this.y = 0;                 // set by arena (ground line)
    this.vx = 0; this.vy = 0;
    this.facing = facing;
    this.onGround = true;
    this.hp = this.maxHp;
    this.meter = 0;
    this.guard = MAX_GUARD;
    this.state = 'idle';
    this.move = null;
    this.special = null;
    this.frame = 0;
    this.stateTime = 0;
    this.stun = 0;
    this.hitUsed = false;
    this.specialHitFlags = [];
    this.comboCount = 0;
    this.comboDecay = 0;
    this.damageTaken = 0;
    this.dashTimer = 0;
    this.dashDir = 0;
    this.lastDirTap = { dir: 0, t: -999 };
    this.invuln = 0;
    this.blocking = false;
    this.blockLow = false;
    this.guardBroken = 0;
    this.knockdownTimer = 0;
    this.flash = 0;
    this.winPose = 0;
    this.intro = 0;
    this.anim = 'idle';
    this.animT = 0;
    this.facingLock = false;
    this.pendingSpecial = null;
    this.juggle = 0;
    this.lastHitBy = null;
    this.tonicFlash = 0;
    this.buffered = null;
    this.chain = 0;
    this.chainTimer = 0;
  };

  Fighter.prototype.alive = function () { return this.hp > 0; };

  Fighter.prototype.stance = function () {
    if (!this.onGround) return 'air';
    if (this.state === 'crouch' || (this.state === 'idle' && this.crouchHeld)) return 'crouch';
    return 'stand';
  };

  Fighter.prototype.canAct = function () {
    if (this.state === 'ko' || this.state === 'intro' || this.state === 'win') return false;
    if (this.state === 'attack' || this.state === 'special') return false;
    if (this.state === 'hitstun' || this.state === 'blockstun' || this.state === 'knockdown' || this.state === 'guardbreak') return false;
    return true;
  };

  /* Ground normals cancel into specials from their startup onward, hit or
   * miss. Strict hit-confirm reads better on a pad, but this game is played
   * with thumbs: a combo sequence has to flow out of whatever you are already
   * swinging, or the last button of a six-input string never lands in time. */
  Fighter.prototype.canCancel = function () {
    if (this.state !== 'attack' || !this.move) return false;
    if (Moves.CANCELABLE.indexOf(this.move.id) === -1) return false;
    return this.frame >= Math.max(1, this.move.startup - 2);
  };

  Fighter.prototype.hurtbox = function () {
    let b;
    if (this.state === 'knockdown' || this.state === 'ko') b = HURT.down;
    else if (!this.onGround) b = HURT.air;
    else if (this.stance() === 'crouch') b = HURT.crouch;
    else b = HURT.stand;
    return this.toWorld(b);
  };

  Fighter.prototype.toWorld = function (b) {
    const s = this.scale;
    const w = b.w * s, h = b.h * s;
    const lx = this.facing > 0 ? b.x * s : -b.x * s - w;
    return { x: this.x + lx, y: this.y - (b.y * s) - h, w, h };
  };

  Fighter.prototype.height = function () { return HURT.stand.h * this.scale; };

  // ---------------------------------------------------------------- intent
  /* intent: {dir:-1|0|1, crouch, jump, block, button:'P1'|'P2'|'K'|null,
   *          special: specDef|null, dashDir:-1|0|1}
   *
   * Attacks pressed a few frames too early are remembered and fired the moment
   * the fighter can act again. Without this, tapping a 3-button combo at human
   * speed loses inputs to the previous move's recovery. */
  Fighter.prototype.applyIntent = function (intent, opponent, dt) {
    if (this.state === 'ko' || this.state === 'intro' || this.state === 'win') return;

    if (this.buffered) {
      this.buffered.life -= (dt || 1 / 60);
      if (this.buffered.life <= 0) this.buffered = null;
    }
    const canUseBuffer = this.buffered &&
      (this.canAct() || (this.buffered.special && this.canCancel()));
    if (canUseBuffer) {
      intent = Object.assign({}, intent, {
        button: this.buffered.button,
        special: this.buffered.special,
        crouch: this.buffered.crouch,
      });
      this.buffered = null;
    } else if ((intent.button || intent.special) && !this.canAct() &&
               !(intent.special && this.canCancel())) {
      this.buffered = {
        button: intent.button, special: intent.special,
        crouch: intent.crouch, life: BUFFER_SECONDS,
      };
    }

    // Face the opponent whenever we're free to turn.
    if (opponent && this.canAct() && !this.facingLock) {
      const want = opponent.x >= this.x ? 1 : -1;
      if (this.state !== 'crouch' || Math.abs(opponent.x - this.x) > 20) this.facing = want;
    }

    this.crouchHeld = !!intent.crouch && this.onGround;

    // Special takes priority: from neutral, or cancelling a connected normal.
    if (intent.special && (this.canAct() || this.canCancel())) {
      if (this.meter >= intent.special.cost) {
        this.startSpecial(intent.special);
        return;
      }
    }

    if (!this.canAct()) return;

    if (intent.button) {
      const dirIntent = intent.dir === 0 ? null : (intent.dir === this.facing ? 'fwd' : 'back');
      const mv = Moves.normalFor(intent.button, this.stance(), dirIntent);
      this.startMove(mv);
      return;
    }

    if (intent.jump && this.onGround) {
      this.vy = -JUMP_V;
      this.onGround = false;
      this.state = 'jump';
      this.vx = intent.dir * WALK_F * 0.95 * this.stats.spdMul;
      this.setAnim('jump');
      root.ST.Audio.play('jump');
      return;
    }

    if (intent.dashDir && this.onGround && this.dashTimer <= 0) {
      this.dashTimer = 13;
      this.dashDir = intent.dashDir;
      this.vx = intent.dashDir * DASH_V * this.stats.spdMul;
      this.setAnim('dash');
      return;
    }

    // Holding away from the opponent = block (classic street-fighter guard).
    const away = opponent ? (opponent.x >= this.x ? -1 : 1) : 0;
    const holdingBack = intent.dir === away && away !== 0;
    this.blocking = this.onGround && this.guardBroken <= 0 && (holdingBack || !!intent.block);
    this.blockLow = this.blocking && this.crouchHeld;

    if (this.onGround) {
      if (this.crouchHeld) {
        this.state = 'crouch';
        this.vx = U.approach(this.vx, 0, GROUND_FRICTION / 60);
        this.setAnim(this.blocking ? 'blockLow' : 'crouch');
      } else if (intent.dir !== 0 && !this.blocking) {
        this.state = 'walk';
        const fwd = intent.dir === this.facing;
        this.vx = intent.dir * (fwd ? WALK_F : WALK_B) * this.stats.spdMul;
        this.setAnim(fwd ? 'walk' : 'walkBack');
      } else if (intent.dir !== 0 && this.blocking) {
        this.state = 'walk';
        this.vx = intent.dir * WALK_B * 0.7 * this.stats.spdMul;
        this.setAnim('block');
      } else {
        this.state = 'idle';
        this.vx = U.approach(this.vx, 0, GROUND_FRICTION / 60);
        this.setAnim(this.blocking ? 'block' : 'idle');
      }
    }
  };

  Fighter.prototype.setAnim = function (name) {
    if (this.anim !== name) { this.anim = name; this.animT = 0; }
  };

  Fighter.prototype.startMove = function (mv) {
    this.move = mv;
    this.special = null;
    this.state = 'attack';
    this.frame = 0;
    this.hitUsed = false;
    this.moveConnected = false;
    this.blocking = false;
    this.setAnim(mv.anim);
    this.facingLock = true;
    if (mv.stance !== 'air') this.vx = 0;
    root.ST.Audio.play(mv.sfx || 'whiffLight');
  };

  Fighter.prototype.startSpecial = function (spec) {
    this.special = spec;
    this.move = null;
    this.state = 'special';
    this.frame = 0;
    this.specialHitFlags = spec.hits.map(() => false);
    this.projectileFired = false;
    this.meter = Math.max(0, this.meter - spec.cost);
    this.blocking = false;
    this.facingLock = true;
    this.setAnim(spec.anim || 'special');
    root.ST.Audio.play('whiffHeavy');
    this.onSpecialStart && this.onSpecialStart(spec);
  };

  // ---------------------------------------------------------------- update
  Fighter.prototype.update = function (dt, bounds, opponent) {
    const fr = dt * 60;                 // fraction of a 60fps frame
    this.stateTime += dt;
    this.animT += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.tonicFlash > 0) this.tonicFlash -= dt;
    if (this.invuln > 0) this.invuln -= fr;
    if (this.dashTimer > 0) this.dashTimer -= fr;
    if (this.guardBroken > 0) this.guardBroken -= fr;
    if (this.comboDecay > 0) {
      this.comboDecay -= dt;
      if (this.comboDecay <= 0) this.comboCount = 0;
    }

    // Guard regenerates while you're not eating pressure.
    if (this.guard < MAX_GUARD && this.state !== 'blockstun' && this.guardBroken <= 0) {
      this.guard = Math.min(MAX_GUARD, this.guard + 16 * dt);
    }

    if (this.state === 'attack') this.tickMove(fr);
    else if (this.state === 'special') this.tickSpecial(fr);
    else if (this.state === 'hitstun' || this.state === 'blockstun' || this.state === 'guardbreak') {
      this.stun -= fr;
      if (this.stun <= 0) {
        if (!this.onGround) { this.state = 'jump'; this.setAnim('jump'); }
        else { this.state = 'idle'; this.setAnim('idle'); this.facingLock = false; }
      }
    } else if (this.state === 'knockdown') {
      this.knockdownTimer -= fr;
      if (this.knockdownTimer <= 0 && this.onGround) {
        this.state = 'idle';
        this.invuln = 12;
        this.setAnim('wakeup');
        this.facingLock = false;
      }
    }

    // Physics
    if (!this.onGround) {
      this.vy += GRAVITY * dt;
      this.vx = U.approach(this.vx, 0, AIR_DRAG * dt);
    } else if (this.state !== 'walk' && this.dashTimer <= 0 && this.state !== 'attack' && this.state !== 'special') {
      this.vx = U.approach(this.vx, 0, GROUND_FRICTION * dt);
    } else if (this.dashTimer <= 0 && (this.state === 'attack' || this.state === 'special')) {
      this.vx = U.approach(this.vx, 0, GROUND_FRICTION * 0.8 * dt);
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    const groundY = bounds.ground;
    if (this.y >= groundY) {
      if (!this.onGround) {
        this.onGround = true;
        this.vy = 0;
        this.y = groundY;
        if (this.state === 'hitstun' && this.pendingKnockdown) {
          this.toKnockdown();
        } else if (this.state === 'hitstun') {
          this.stun = Math.max(this.stun, 8);
        } else if (this.state === 'attack' || this.state === 'special') {
          // land out of an air normal
          if (this.move && this.move.stance === 'air') this.endMove();
        } else if (this.state !== 'knockdown' && this.state !== 'ko') {
          this.state = 'idle';
          this.setAnim('land');
          root.ST.Audio.play('land');
        }
      }
      this.y = groundY;
      this.vy = 0;
    } else {
      this.onGround = false;
    }

    this.x = U.clamp(this.x, bounds.left, bounds.right);

    if (this.hp <= 0 && this.state !== 'ko') this.toKO();
  };

  Fighter.prototype.tickMove = function (fr) {
    const mv = this.move;
    const speed = mv.stance === 'air' ? 1 : this.stats.aspdMul;
    this.frame += fr * speed;
    const total = Moves.totalFrames(mv);

    if (mv.moveX && this.frame < mv.startup + mv.active && this.onGround) {
      this.vx = this.facing * mv.moveX * 3.2 * (this.frame < mv.startup ? 0.5 : 1);
    }
    if (this.frame >= total) this.endMove();
  };

  Fighter.prototype.endMove = function () {
    this.move = null;
    this.frame = 0;
    this.facingLock = false;
    this.state = this.onGround ? 'idle' : 'jump';
    this.setAnim(this.onGround ? 'idle' : 'jump');
  };

  Fighter.prototype.tickSpecial = function (fr) {
    const sp = this.special;
    this.frame += fr;
    (sp.steps || []).forEach((s) => {
      if (this.frame >= s.f && this.frame - fr < s.f) {
        if (s.vx) this.vx = this.facing * s.vx;
        if (s.vy) { this.vy = -s.vy; this.onGround = false; }
      }
    });
    if (sp.invuln && this.frame >= sp.invuln[0] && this.frame <= sp.invuln[1]) this.invuln = 2;
    if (this.frame >= sp.duration) {
      this.special = null;
      this.frame = 0;
      this.facingLock = false;
      this.state = this.onGround ? 'idle' : 'jump';
      this.setAnim(this.onGround ? 'idle' : 'jump');
    }
  };

  // ------------------------------------------------------------ hit output
  /* Active hitboxes this frame, with the data needed to resolve a hit. */
  Fighter.prototype.activeHits = function () {
    const out = [];
    if (this.state === 'attack' && this.move && !this.hitUsed) {
      const mv = this.move;
      if (this.frame >= mv.startup && this.frame < mv.startup + mv.active) {
        out.push({ box: this.toWorld(mv.box), data: mv, key: 'normal' });
      }
    } else if (this.state === 'special' && this.special) {
      const sp = this.special;
      sp.hits.forEach((h, i) => {
        if (this.specialHitFlags[i]) return;
        if (this.frame >= h.f && this.frame < h.f + h.active) {
          out.push({ box: this.toWorld(h.box), data: Object.assign({ special: sp, name: sp.name }, h), key: i });
        }
      });
    }
    return out;
  };

  Fighter.prototype.markHitUsed = function (key) {
    if (key === 'normal') { this.hitUsed = true; this.moveConnected = true; }
    else this.specialHitFlags[key] = true;
  };

  Fighter.prototype.addMeter = function (amount) {
    const before = this.meter;
    this.meter = U.clamp(this.meter + amount * (this.stats.rageMul || 1), 0, 100);
    if (before < 100 && this.meter >= 100 && this.isPlayer) root.ST.Audio.play('meterFull');
  };

  // ------------------------------------------------------------- hit input
  /* Decide block vs hit and apply the result. Returns a result descriptor the
   * arena uses for FX, combo counting and score. */
  Fighter.prototype.receiveHit = function (attacker, hit, scaling) {
    if (this.invuln > 0 || this.state === 'ko') return { result: 'miss' };

    const d = hit.data;
    const guardType = d.guard || 'mid';
    let blocked = false;

    if (this.blocking && this.onGround && this.guardBroken <= 0) {
      if (guardType === 'low') blocked = this.blockLow;
      else if (guardType === 'overhead') blocked = !this.blockLow;
      else blocked = true;
    }

    const dirFromAttacker = this.x >= attacker.x ? 1 : -1;

    if (blocked) {
      const bs = d.blockstun || 10;
      this.state = 'blockstun';
      this.stun = bs;
      this.setAnim(this.blockLow ? 'blockLow' : 'block');
      this.vx = dirFromAttacker * (d.pushback || 40) * 1.6;
      const drain = (d.guardCrush || 0) + (d.dmg || 6) * 0.9;
      this.guard -= drain;
      const chip = d.special ? Math.max(1, d.dmg * 0.12) : 0;
      if (chip) this.hp = Math.max(1, this.hp - chip);
      this.addMeter(1.5);
      attacker.addMeter((d.meter || 3) * 0.4);
      if (this.guard <= 0) {
        this.guard = 0;
        this.guardBroken = 110;
        this.state = 'guardbreak';
        this.stun = 46;
        this.setAnim('stunned');
        this.blocking = false;
        root.ST.Audio.play('guardBreak');
        return { result: 'guardbreak', dmg: chip };
      }
      root.ST.Audio.play('block');
      return { result: 'block', dmg: chip };
    }

    // ------- clean hit
    const scale = scaling === undefined ? 1 : scaling;
    let dmg = d.dmg * (attacker.stats.atkMul || 1) * scale;
    const pierce = d.armorPierce || 0;
    const dr = Math.max(0, this.stats.dr * (1 - pierce));

    let crit = false;
    if (Math.random() < (attacker.stats.crit || 0)) {
      crit = true;
      dmg *= attacker.stats.critDmg || 1.6;
    }
    dmg = Math.max(1, Math.round(dmg));

    this.hp = Math.max(0, this.hp - dmg);
    this.damageTaken += dmg;
    this.flash = 0.12;
    this.lastHitBy = attacker;

    if (attacker.stats.lifesteal) {
      attacker.hp = Math.min(attacker.maxHp, attacker.hp + dmg * attacker.stats.lifesteal);
    }

    this.addMeter(dmg * 0.22);
    attacker.addMeter(d.meter || (d.special ? 0 : 4));

    const airborne = !this.onGround;
    this.blocking = false;
    this.facingLock = true;

    if (d.lift) {
      this.vy = -d.lift;
      this.onGround = false;
      this.juggle++;

    this.vx = dirFromAttacker * (d.kb || 100) * 1.15;

    if (d.knockdown && this.onGround) {

/* ===== src/ai.js ===== */
/* Stickman Tower — boss brain.
 *
 * Produces the same `intent` object the player's controls produce, so bosses
 * are bound by exactly the same rules: same frame data, same blocking, same
 * meter. Difficulty comes from reaction time, spacing and discipline.
 */
(function (root) {
  'use strict';

  const U = root.ST.U;
  const Moves = root.ST.Moves;

  const BOSS_SPECIAL_IDS = ['twinSweep', 'risingFang', 'cyclone', 'hammerFall', 'tornado', 'shadowDance', 'dashSmash', 'ironWaltz', 'thunderCross'];

  function AI(fighter, profile, floor) {
    this.f = fighter;
    this.p = profile;
    this.floor = floor;
    this.queue = [];
    this.cool = 30;
    this.rng = U.rng(floor * 7919 + 17);
    this.phase = 1;
    this.specials = Moves.SPECIALS.filter((s) =>
      BOSS_SPECIAL_IDS.indexOf(s.id) !== -1 && s.unlock * 5 <= floor + 6);
    this.lastSpecial = -999;
    this.t = 0;
  }

  AI.prototype.enterPhase2 = function () {
    if (this.phase === 2) return;
    this.phase = 2;
    this.p = Object.assign({}, this.p, {
      aggression: U.clamp(this.p.aggression * 1.3, 0, 0.97),
      reaction: Math.max(3, Math.round(this.p.reaction * 0.7)),
      specialChance: U.clamp(this.p.specialChance + 0.18, 0, 0.7),
      comboLen: Math.min(6, this.p.comboLen + 1),
    });
  };

  AI.prototype.push = function (step, frames) {
    this.queue.push({ step, frames: frames, first: true });
  };

  AI.prototype.idleIntent = function () {
    return { dir: 0, crouch: false, jump: false, block: false, button: null, special: null, dashDir: 0 };
  };

  AI.prototype.update = function (dt, opp) {
    this.t += dt;
    const fr = dt * 60;
    const f = this.f;

    if (!f.alive() || f.state === 'ko' || opp.state === 'ko') return this.idleIntent();

    if (this.cool > 0) this.cool -= fr;

    if (!this.queue.length && this.cool <= 0) this.decide(opp);

    if (!this.queue.length) return this.idleIntent();

    const head = this.queue[0];
    const intent = Object.assign(this.idleIntent(), head.step);
    if (!head.first) { intent.button = null; intent.special = null; intent.jump = false; intent.dashDir = 0; }
    head.first = false;
    head.frames -= fr;
    if (head.frames <= 0) this.queue.shift();
    return intent;
  };

  AI.prototype.dist = function (opp) { return Math.abs(opp.x - this.f.x); };
  AI.prototype.toward = function (opp) { return opp.x >= this.f.x ? 1 : -1; };

  AI.prototype.decide = function (opp) {
    const f = this.f, p = this.p, rng = this.rng;
    const d = this.dist(opp);
    const toward = this.toward(opp);
    const away = -toward;

    this.cool = Math.max(2, p.reaction * rng.range(0.7, 1.3));

    // --- defensive reads first -------------------------------------------
    const oppAttacking = opp.state === 'attack' || opp.state === 'special';
    if (oppAttacking && d < 150 && rng.chance(p.blockChance)) {
      const low = opp.move ? opp.move.guard === 'low' : rng.chance(0.4);
      this.push({ dir: away, crouch: low, block: true }, 16 + rng.int(0, 14));
      return;
    }

    // Anti-air: they jumped, we swat them out of the sky.
    if (!opp.onGround && d < 190 && rng.chance(p.antiAir)) {
      const rising = this.specials.find((s) => s.id === 'risingFang');
      if (rising && f.meter >= rising.cost && rng.chance(0.5)) {
        this.push({ special: rising }, 8);
      } else {
        this.push({ button: 'K' }, 10);
      }
      return;
    }

    // Whiff punish: they swung and missed, close the gap and hit back.
    if (p.whiffPunish && opp.state === 'attack' && opp.frame > (opp.move ? opp.move.startup + opp.move.active : 6) && d < 210) {
      if (d > 90) this.push({ dashDir: toward }, 12);
      this.push({ button: rng.chance(0.5) ? 'P2' : 'K' }, 14);
      return;
    }

    // Wake-up pressure / okizeme.
    if (opp.state === 'knockdown' && d < 220) {
      if (d > 110) this.push({ dir: toward }, 12 + rng.int(0, 8));
      else this.push({ dir: 0 }, 10 + rng.int(0, 16));
      return;
    }

    // --- offence ---------------------------------------------------------
    const wantsSpecial = f.meter >= 25 && rng.chance(p.specialChance) && (this.t - this.lastSpecial) > 2.2;
    if (wantsSpecial) {
      const usable = this.specials.filter((s) => f.meter >= s.cost);
      if (usable.length) {
        const sp = rng.pick(usable);
        this.lastSpecial = this.t;
        if (d > 120 && sp.id !== 'dashSmash') this.push({ dir: toward }, Math.min(30, (d - 90) / 3));
        this.push({ special: sp }, 10);
        return;
      }
    }

    const inRange = d < 96;
    const nearRange = d < 150;

    if (inRange && rng.chance(p.aggression)) {
      this.pushCombo(opp, rng);
      return;
    }

    if (nearRange && rng.chance(p.aggression * 0.7)) {
      // Step in then swing.
      this.push({ dir: toward }, 8 + rng.int(0, 8));
      this.pushCombo(opp, rng);
      return;
    }

    if (p.projectile && d > 260 && rng.chance(0.35)) {
      const shock = Moves.SPECIAL_BY_ID.shockPalm;
      if (f.meter >= shock.cost) { this.push({ special: shock }, 10); return; }
    }

    // Jump-in approach.
    if (d > 140 && d < 340 && rng.chance(p.jumpiness)) {
      this.push({ dir: toward, jump: true }, 18);
      this.push({ dir: toward, button: rng.chance(0.5) ? 'K' : 'P1' }, 14);
      return;
    }

    // Spacing: hold their preferred range, don't just run in mindlessly.
    if (d > p.spacing + 30) {
      if (d > 260 && rng.chance(0.35)) this.push({ dashDir: toward }, 14);
      else this.push({ dir: toward }, 14 + rng.int(0, 16));
    } else if (d < p.spacing - 30 && rng.chance(0.5)) {
      this.push({ dir: away }, 12 + rng.int(0, 14));
    } else {
      // Feint / breathe — gives the player an opening, which is the point.
      if (rng.chance(0.35)) this.push({ dir: 0, crouch: rng.chance(0.3) }, 10 + rng.int(0, 18));
      else this.pushCombo(opp, rng);
    }
  };

  /* A short string of normals with a stance mix-up, like a human would throw. */
  AI.prototype.pushCombo = function (opp, rng) {
    const p = this.p;
    const len = 1 + rng.int(1, Math.max(1, p.comboLen));
    for (let i = 0; i < len; i++) {
      const last = i === len - 1;
      let button = 'P1';
      const r = rng();
      if (last) button = r < 0.45 ? 'K' : r < 0.8 ? 'P2' : 'P1';
      else button = r < 0.55 ? 'P1' : r < 0.85 ? 'P2' : 'K';
      const lowMix = p.mixup ? rng.chance(0.42) : rng.chance(0.2);
      const gap = button === 'P1' ? 12 : button === 'P2' ? 20 : 28;
      this.push({ button, crouch: lowMix }, gap + rng.int(0, 6));
    }
    // Small breather after a string so the player gets their turn.
    this.push({ dir: 0 }, 8 + rng.int(0, 18));
  };

  root.ST = root.ST || {};
  root.ST.AI = AI;
})(window);

/* ===== src/render.js ===== */
/* Stickman Tower — rendering: skeletal stickmen, tiered arenas, FX, fight HUD.
 * Everything is drawn procedurally; there are no image assets to download.
 */
(function (root) {
  'use strict';

  const U = root.ST.U;

  const W = 960, H = 540;              // logical resolution (letterboxed to fit)
  const GROUND_Y = 470;

  // Stickman proportions, in local units (multiplied by fighter.scale).
  const P = {
    pelvis: 52, neck: 86, headY: 100, headR: 11,
    thigh: 28, shin: 26, upperArm: 24, foreArm: 22, shoulderW: 9, hipW: 7,
  };

  const R = { W, H, GROUND_Y };

  // ------------------------------------------------------------------ math
  function dirVec(angleDeg, facing) {
    const a = U.rad(angleDeg);
    return { x: Math.sin(a) * facing, y: Math.cos(a) };
  }

  function limb(ox, oy, a1, l1, a2, l2, facing) {
    const d1 = dirVec(a1, facing);
    const j = { x: ox + d1.x * l1, y: oy + d1.y * l1 };
    const d2 = dirVec(a1 + a2, facing);
    const e = { x: j.x + d2.x * l2, y: j.y + d2.y * l2 };

  }

  // ----------------------------------------------------------------- poses
  // A pose is: torso lean, hip drop, and [shoulder, elbow] / [hip, knee] pairs

  function basePose() {
    return {
      lean: 6, hip: 0, headTilt: 0,

      legF: [10, 10], legB: [-12, 12],

    };

    o.hip = U.lerp(a.hip, b.hip, t);
    o.headTilt = U.lerp(a.headTilt, b.headTilt, t);
    o.stretch = U.lerp(a.stretch === undefined ? 1 : a.stretch, b.stretch === undefined ? 1 : b.stretch, t);

    idle2: pose({ lean: 8, armF: [22, 28], armB: [-10, 34], legF: [8, 12], legB: [-10, 14] }),

    guardLow: pose({ lean: 16, hip: 26, armF: [62, 90], armB: [50, 96], legF: [40, 78], legB: [-30, 70] }),
    crouch: pose({ lean: 18, hip: 28, armF: [30, 50], armB: [-8, 46], legF: [42, 80], legB: [-32, 72] }),
    jump: pose({ lean: 4, armF: [-40, 20], armB: [-60, 24], legF: [46, 58], legB: [-26, 40] }),
    fall: pose({ lean: 10, armF: [-70, 14], armB: [-84, 18], legF: [30, 30], legB: [-16, 28] }),
    land: pose({ lean: 14, hip: 16, armF: [40, 40], armB: [-20, 40], legF: [30, 52], legB: [-24, 50] }),

    jabWind: pose({ lean: 4, armF: [42, 78], armB: [-20, 40] }),
    jabHit: pose({ lean: 12, armF: [90, 2], armB: [-30, 56], legF: [16, 14], legB: [-16, 14] }),
    crossWind: pose({ lean: -6, armF: [20, 60], armB: [-46, 84] }),
    crossHit: pose({ lean: 18, armF: [-24, 48], armB: [92, 4], legF: [22, 12], legB: [-20, 20] }),
    kickWind: pose({ lean: -10, armF: [-10, 50], armB: [-40, 60], legF: [44, 92], legB: [-8, 10] }),

    bodyWind: pose({ lean: 10, hip: 26, armF: [10, 60], armB: [-30, 70], legF: [42, 78], legB: [-30, 70] }),
    bodyHit: pose({ lean: 2, hip: 18, armF: [-10, 40], armB: [62, 10], legF: [36, 64], legB: [-26, 60] }),

      case 'hurt': return lerpPose(POSE.hurt, POSE.idle, U.clamp(f.animT * 3.5, 0, 1));
